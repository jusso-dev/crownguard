# Keeps GitHub Actions, npm and Cargo (the terminal app in tui/) dependencies current. Major updates come one at a
# time so a breaking change is easy to spot; minor and patch updates are grouped to keep the pull request count down.
# Patch groups and the dev-dependencies group auto-merge once CI passes (see .github/workflows/dependabot-auto-merge.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-patch:
        patterns: ["*"]
        update-types: [patch]
      actions-minor:
        patterns: ["*"]
        update-types: [minor]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:23"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-patch:
        dependency-type: production
        update-types: [patch]
      runtime-minor:
        dependency-type: production
        update-types: [minor]

  - package-ecosystem: cargo
    directory: /tui
    schedule:
      interval: weekly
      day: monday
      time: "05:29"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      crates:
        patterns: ["*"]
        update-types: [minor, patch]
