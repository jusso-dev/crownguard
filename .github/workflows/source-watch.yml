name: Source watch

# Checks every page cited in content/sources each night and keeps one pull request (branch bot/source-watch) open
# while a source is broken, moved, retired, substantially changed or out of date, or new guidance appears.
# How to handle the PR: docs/content-guide.md#source-watch

on:
  schedule:
    # 16:41 UTC is 02:41 AEST / 03:41 AEDT, away from the top of the hour when GitHub delays or drops scheduled runs.
    - cron: "41 16 * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: Add a fake change to test the pull request path, on its own branch (close that PR without merging)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: source-watch
  cancel-in-progress: false

jobs:
  scan:
    name: Check cited sources
    # This job parses untrusted web pages, so it only ever gets a read-only token.
    if: github.repository == 'jusso-dev/crownguard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      actionable: ${{ steps.scan.outputs.actionable }}
      title: ${{ steps.scan.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Page text for diffs lives only here, never in the repo: not every cited site's content is openly licensed.
      - name: Restore page snapshots
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/source-watch-cache
          key: source-watch-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            source-watch-v1-

      - name: Check sources
        id: scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional. When the secret is set, Claude triages substantial changes against the questions that cite them.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WATCH_SIMULATE: ${{ inputs.simulate && 'true' || 'false' }}
        run: >-
          pnpm watch:sources
          --cache "$RUNNER_TEMP/source-watch-cache"
          --out "$RUNNER_TEMP/source-watch"

      - name: Save page snapshots
        # A simulated run must not leave its snapshots or bookkeeping in the cache the nightly run restores.
        if: always() && steps.scan.outcome == 'success' && !inputs.simulate
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/source-watch-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-watch
          path: ${{ runner.temp }}/source-watch/
          retention-days: 30
          if-no-files-found: error

  propose:
    name: Open, update or close the pull request
    needs: scan
    if: github.repository == 'jusso-dev/crownguard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-watch
          path: ${{ runner.temp }}/source-watch

      # With nothing actionable the workspace stays clean, so the next step closes any stale PR.
      - name: Apply the scan results
        if: needs.scan.outputs.actionable == 'true'
        run: pnpm watch:apply "$RUNNER_TEMP/source-watch"

      # CI on a PR opened with GITHUB_TOKEN waits for a maintainer's approval, so check everything here first.
      - name: Validate
        if: needs.scan.outputs.actionable == 'true'
        run: |
          pnpm validate:content
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Open, update or close the pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A simulated run gets its own branch so it never rewrites or closes the real PR.
          branch: ${{ inputs.simulate && 'bot/source-watch-simulated' || 'bot/source-watch' }}
          base: main
          add-paths: |
            watch/state.json
            content/sources/*.yaml
          commit-message: Update cited sources and the source watch baseline
          title: ${{ needs.scan.outputs.title }}
          body-path: ${{ runner.temp }}/source-watch/pr-body.md
          labels: source-watch
          delete-branch: true
          sign-commits: true

      - name: Summary
        env:
          OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          printf 'Pull request: %s %s\n' "$OPERATION" "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
