name: CI

# Everything that has to pass before anything ships: content validation, lint, typecheck, unit tests, then the full
# Playwright journeys against the production build. The Pages deploy is the last job in this workflow on purpose, so a
# commit whose tests fail can never reach the site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No token by default. Each job below asks for exactly what it uses.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:content
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Warn-only on purpose: must not fail CI and block unrelated PRs. GitHub disables scheduled workflows after 60 days
  # without repository activity; this surfaces a quiet source-watch schedule with the re-enable link.
  source-watch-heartbeat:
    name: source-watch heartbeat
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Warn if scheduled source-watch is older than 3 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          REPO="${{ github.repository }}"
          LINK="https://github.com/${REPO}/actions/workflows/source-watch.yml"
          CREATED=$(gh api "repos/${REPO}/actions/workflows/source-watch.yml/runs?event=schedule&per_page=1" --jq '.workflow_runs[0].created_at // empty' 2>/tmp/sw-heartbeat.err)
          STATUS=$?
          if [ "$STATUS" -ne 0 ] || [ -z "$CREATED" ]; then
            echo "::warning::Could not read the latest scheduled source-watch run (API may be unavailable, or no schedule has run yet). Re-enable if needed: ${LINK}"
            exit 0
          fi
          AGE_SECONDS=$(( $(date -u +%s) - $(date -u -d "$CREATED" +%s) ))
          if [ "$AGE_SECONDS" -gt $((3 * 24 * 60 * 60)) ]; then
            echo "::warning::Last scheduled source-watch run was at ${CREATED} (more than 3 days ago). GitHub disables schedules after 60 quiet days — re-enable: ${LINK}"
          else
            echo "Last scheduled source-watch run: ${CREATED}"
          fi
          exit 0

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  # Publishes to GitHub Pages. Only this job holds the Pages write permission and the OIDC token, and it runs only
  # when the tests above have passed on main.
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /crownguard/
      # One file to attest, so the bundle can be traced back to this commit and run.
      - run: tar -czf crownguard-dist.tar.gz -C dist .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: crownguard-dist.tar.gz
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
