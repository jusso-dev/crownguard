name: Dependabot auto-merge

# Enables squash auto-merge for Dependabot pull requests carrying patch updates or grouped minor dev-dependency updates.
# Required CI checks still have to pass before GitHub merges the pull request. Major updates and minor runtime or
# Actions updates stay open for review.

on: pull_request_target

permissions: {}

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'jusso-dev/crownguard'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch and dev-dependency updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
            steps.metadata.outputs.dependency-type != 'direct:production' &&
            (steps.metadata.outputs.dependency-type == 'direct:development' ||
              steps.metadata.outputs.dependency-group == 'dev-dependencies'))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
