name: Scorecard

# Weekly OpenSSF Scorecard run. Results are published to the Scorecard API (the badge in the README reads them) and
# the SARIF is kept as an artifact for 90 days.

on:
  branch_protection_rule:
  schedule:
    # 05:27 UTC on Mondays, away from the top of the hour.
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 90
