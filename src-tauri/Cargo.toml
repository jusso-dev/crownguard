[package]
name = "crownguard-desktop"
version = "1.0.0"
description = "crownguard desktop: crown-jewel risk assessment wizard that runs offline"
authors = ["Justin Middler"]
license = "MIT"
repository = "https://github.com/jusso-dev/crownguard"
edition = "2021"
rust-version = "1.89"

[lib]
name = "crownguard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
