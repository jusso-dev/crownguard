# Curated list of well-known AI apps, used to classify the apps in an exported consent inventory (shadow AI
# discovery). Matching is offline and deliberately simple: `namePatterns` are case-insensitive substrings of the app's
# display name, checked in the order entries appear here (most specific first), and `clientIds` are public OAuth client
# ids matched where a vendor documents one. Every entry cites the vendor's own page in content/sources/. The list says
# "this looks like a known kind of AI tool" so an assessor can decide what to do; it never says a tool is safe.
#
# version: bump when the entry shape changes. Adding entries doesn't need a bump.
version: 1
entries:
