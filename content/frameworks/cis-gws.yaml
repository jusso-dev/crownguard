publisher: Center for Internet Security
source: cis-gws
closed: true
note: >-
  CIS Benchmarks are licensed CC BY-NC-SA 4.0; only recommendation numbers and short titles are
  recorded here, never recommendation text. Numbering follows v1.4.0, which merged the v1.3.0
  super admin count recommendations into 1.1.1. Numbers and titles were cross-checked against the
  publicly available Prowler mapping of v1.4.0 because the benchmark PDF requires CIS registration.
