note: >-
  ASD's Essentials for enterprise IT sets out principles (outcomes), actions (what to do) and
  domains (where it applies). Each action is rated per domain as not effective, partially
  effective or fully effective, or left not assessed; principles take the weakest rating of their
  actions, and priority phases set the order to work in. Phases are a sequencing aid, not a
  rating. crownguard's Essentials results are indicative only: they come from the questions
  tagged with each action, not from the Indicators of Good Practice an assessor checks, and they
  are never derived from Essential Eight maturity levels. Action titles are the action
  statements, shortened to 140 characters (an ellipsis marks a cut). `evidence` lists the ISM and
  Essential Eight controls ASD names as potential evidence sources; `igp` counts the Indicators
  of Good Practice statements per tier. © Commonwealth of Australia 2026, licensed CC BY 4.0
  (Coat of Arms and ASD logo excepted), shortened and reformatted by crownguard.
