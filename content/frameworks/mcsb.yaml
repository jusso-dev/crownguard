id: mcsb
name: Microsoft cloud security benchmark v2 (preview)
shortName: MCSB v2
publisher: Microsoft
source: ms-mcsb
closed: true
note: >-
  Microsoft's prescriptive cloud security control set, which also underpins Defender for Cloud's
  regulatory compliance dashboard. Version 2 (preview) supersedes v1 and adds an Artificial
  Intelligence Security domain; v1 control ids for the shared domains are largely unchanged.
