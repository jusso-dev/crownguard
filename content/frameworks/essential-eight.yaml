id: essential-eight
name: ASD Essential Eight Maturity Model (November 2023)
shortName: Essential Eight
publisher: Australian Signals Directorate
source: asd-e8-maturity-model
closed: true
note: >-
  The maturity model defines four levels. Maturity Level Zero signals weaknesses in overall posture;
  Maturity Levels One to Three mitigate increasingly capable tradecraft and targeting. Each level is
  implemented progressively, and ASD recommends reaching the same level across all eight strategies
  before moving higher. The Essential Eight was designed for internet-connected IT networks (largely
  Windows workstations and servers), so for cloud SaaS tenants only some requirements apply directly,
  chiefly multi-factor authentication, restricting administrative privileges and regular backups.
  Results here indicate alignment, not a formal Essential Eight assessment.
