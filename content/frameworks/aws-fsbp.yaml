id: aws-fsbp
name: AWS Foundational Security Best Practices (Security Hub CSPM)
shortName: AWS FSBP
publisher: Amazon Web Services
source: aws-fsbp
closed: true
note: >-
  The control set AWS Security Hub CSPM evaluates for the AWS Foundational Security Best Practices
  standard. Control ids and titles are taken from AWS's standard reference page; a few Security Hub
  controls belong only to other standards (such as CIS) and are not listed here.
controls:
