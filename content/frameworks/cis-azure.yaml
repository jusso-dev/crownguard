id: cis-azure
name: CIS Microsoft Azure Foundations Benchmark v7.0.0
shortName: CIS Azure v7
publisher: Center for Internet Security
source: cis-azure
closed: true
note: >-
  CIS Benchmarks are licensed CC BY-NC-SA 4.0; only recommendation numbers and short titles are
  recorded here, never recommendation text. The benchmark PDF requires CIS registration, so the
  v7.0.0 numbers and titles were cross-checked against two public mappings retrieved 22-11-2026:
  the AzCmply CIS Azure 7.0.0 catalogue (github.com/jflieben/AzCmply) and the CIS Azure v7.0.0
  module of github.com/ynotbhatc/rego_policy_libraries, which agree on all 128 numbers, profile
  levels and assessment statuses. Prowler has no v7.0.0 mapping yet. Since v7.0.0 the Databricks,
  compute, database and most storage recommendations are in separate CIS service benchmarks.
