note: >-
  The Information Security Manual (ISM) is the Australian Government's cyber security guidance
  for agencies and the systems they hold. crownguard maps its questions to ISM controls; it does
  not assess every ISM control, and this is not an IRAP assessment or a statement of
  applicability. Alignment is indicative: it shows which ISM controls a question's subject
  relates to, not that the organisation meets them. Each control carries the ISM's own
  attributes: `updated` is the month ASD last changed it, `applicability` the security
  classifications it applies to (NC non-classified, OS OFFICIAL: Sensitive, P PROTECTED, S
  SECRET, TS TOP SECRET), and `e8` the Essential Eight maturity levels it is required at. The
  Essential Eight Maturity Model remains the source of truth for maturity results. Control ids
  are the OSCAL ids in display form (ism-1504 shown as ISM-1504), titles are the statement of
  each control shortened to 140 characters (an ellipsis marks a cut), and group is the guideline,
  section and topic the control sits under. Titles are shortened statements © Commonwealth of
  Australia 2024, licensed CC BY 4.0 (Coat of Arms and ASD logo excepted), shortened and
  reformatted by crownguard.
