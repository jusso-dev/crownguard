- id: AWS-LOG-007
  module: core
  domain: logging-detection
  appliesTo: [aws-workloads, aws-data-stores]
  severity: medium
  question: Are VPC flow logs turned on for the VPCs that hold crown-jewel workloads and data, and kept in the log archive?
  why: >-
    Flow logs show which addresses talked to which, how much data left and when. Without them you can't
    confirm or rule out data exfiltration after an incident.
  yesLooksLike: >-
    Every VPC (at least production and crown-jewel VPCs) publishes flow logs of accepted and rejected
    traffic to the Log Archive account or CloudWatch Logs, kept for at least 12 months. GuardDuty analyses
    flow data on its own, but doesn't give you a copy to investigate with.
  remediation: >-
    Create flow logs for each VPC (and check coverage with AWS Config or your CSPM), deliver them to the
    central bucket in the Log Archive account, and set lifecycle retention.
  effort: S
  sources: [aws-vpc-flow-logs]
  refs:
    - { framework: cis-aws, ref: "4.7" }
    - { framework: aws-fsbp, ref: EC2.6 }
    - { framework: nist-csf-2, ref: DE.CM-01 }
    - { framework: nist-csf-2, ref: PR.PS-04 }

- id: AWS-LOG-008
  module: core
  domain: logging-detection
  appliesTo: ["*"]
  severity: high
  question: Are high and critical GuardDuty, Security Hub CSPM and other security findings for AWS triaged by a named person or service within a defined time?
  why: >-
    Detection only helps if someone acts on it. Attackers in AWS can move from first access to data theft
    or ransomware within hours, so findings left unread for days give them the time they need.
  yesLooksLike: >-
    Findings flow through EventBridge or Security Hub CSPM integrations to a monitored queue or SIEM, and
    a named team or managed detection and response provider triages high and critical findings against a
    response-time target (for example the same day), including outside business hours under an agreed
    arrangement.
  remediation: >-
    Route GuardDuty and Security Hub CSPM findings through EventBridge to your ticketing system or SIEM,
    set response times by severity, assign an owner or provider for after-hours triage, and review missed
    targets monthly.
  effort: M
  licence: [guardduty, security-hub-cspm]
  sources: [aws-guardduty-findings, aws-security-hub-cspm, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: DE.AE-02 }
    - { framework: nist-csf-2, ref: RS.MA-02 }
  e8:
    - { strategy: mfa, level: 2 }
    - { strategy: restrict-admin-privileges, level: 2 }

- id: AWS-LOG-009
  module: core
  domain: logging-detection
  appliesTo: ["*"]
  severity: high
  question: If you run internet-facing servers or web front ends on AWS, are their logs collected centrally and analysed for signs of compromise in a timely manner?
  why: >-
    Internet-facing servers are scanned and attacked within minutes of going online, and a compromised
    server exposes the data and role credentials it holds. Its logs only help if someone reviews them
    while there's still time to act.
  yesLooksLike: >-
    Every internet-facing EC2 instance sends its system, authentication and security logs (through the
    CloudWatch agent, an EDR agent or a SIEM agent) to the central log store; access logs from
    internet-facing load balancers, CloudFront distributions, API Gateway stages and AWS WAF are turned
    on and collected; detections or GuardDuty Runtime Monitoring raise alerts from them; and those alerts
    reach the same triage queue as other findings. Answer N/A if you run nothing internet-facing on AWS.
  remediation: >-
    Install the CloudWatch agent or your EDR or SIEM agent on internet-facing instances to collect
    syslog, authentication logs and Windows security events, turn on access logging for internet-facing
    load balancers, CloudFront, API Gateway and AWS WAF, send them to your SIEM or central log account,
    and add detections for common attacks.
  effort: M
  sources: [aws-cloudwatch-agent, aws-guardduty, asd-event-logging, asd-e8-maturity-model]
  refs:
    - { framework: cis-aws, ref: "4.10" }
    - { framework: aws-fsbp, ref: ELB.5 }
    - { framework: aws-fsbp, ref: CloudFront.5 }
    - { framework: nist-csf-2, ref: DE.CM-09 }
    - { framework: nist-csf-2, ref: DE.AE-02 }
  e8:
    - { strategy: mfa, level: 2 }
    - { strategy: restrict-admin-privileges, level: 2 }

- id: AWS-LOG-010
  module: core
  domain: logging-detection
  appliesTo: ["*"]
  severity: medium
  question: When a cyber security incident in AWS is identified, is your incident response plan put into action, with the incident reported to your CISO (or their delegate) and to ASD as soon as possible?
  why: >-
    Without a plan, the first hours of an AWS incident are lost working out who decides what, and
    reporting to ASD brings in help and warns others about the same attack.
  yesLooksLike: >-
    A written incident response plan covers AWS, with playbooks for likely scenarios such as a leaked
    access key, a public bucket or a compromised instance; it names who leads the response, how
    incidents are escalated to the CISO or their delegate, and when and how they're reported to ASD
    through cyber.gov.au; and records of recent incidents or exercises show the plan was followed and the
    reports were made. Exercising the plan at least yearly is recommended.
  remediation: >-
    Write or extend your incident response plan for AWS using AWS's playbook guidance, add escalation to
    the CISO and reporting to ASD, keep forensic access roles and procedures ready, and run a tabletop or
    simulated incident each year.
  effort: M
  sources: [aws-wa-ir-playbooks, asd-ir-planning, asd-report-incident, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: RS.MA-01 }
    - { framework: nist-csf-2, ref: RS.CO-02 }
  e8:
    - { strategy: mfa, level: 2 }
    - { strategy: restrict-admin-privileges, level: 2 }

- id: AWS-LOG-011
  module: core
  domain: logging-detection
  appliesTo: ["*"]
  severity: medium
  question: Are event logs from EC2 servers that aren't internet-facing, and from any Amazon WorkSpaces, collected centrally and analysed for signs of compromise in a timely manner?
  why: >-
    Capable attackers who get in move quietly to internal servers and admin desktops. Logs from those
    machines are how you spot the lateral movement before it reaches your data.
  yesLooksLike: >-
    Every internal EC2 instance and WorkSpaces desktop runs the CloudWatch agent, an EDR agent or a SIEM
    agent that sends its security event logs to the central store; detections or GuardDuty Runtime
    Monitoring raise alerts that are triaged with other findings; and inventory shows no instances
    missing. Answer N/A if you run no EC2 instances or WorkSpaces.
  remediation: >-
    Extend the CloudWatch agent, EDR or SIEM agent rollout to internal instances and WorkSpaces (for
    example with Systems Manager State Manager), add detections for credential theft and lateral
    movement, and compare agent coverage with your instance inventory each month.
  effort: M
  sources: [aws-cloudwatch-agent, aws-guardduty, asd-event-logging, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: DE.CM-09 }
    - { framework: nist-csf-2, ref: DE.AE-02 }
  e8:
    - { strategy: mfa, level: 3 }
    - { strategy: restrict-admin-privileges, level: 3 }
