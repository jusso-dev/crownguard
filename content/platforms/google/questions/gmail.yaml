- id: GO-GML-004
  module: core
  domain: gmail
  appliesTo: [gw-gmail]
  severity: medium
  question: Is the Gmail security sandbox turned on to run attachments in a virtual environment before they are delivered?
  why: >-
    New malware is built to slip past signature scanning. Running attachments in a sandbox catches
    previously unseen malicious documents before they reach finance or executive inboxes.
  yesLooksLike: >-
    Security sandbox is on for all organisational units, or at least for executives, finance and
    admins through security sandbox rules.
  remediation: >-
    In Apps > Google Workspace > Gmail > Spam, phishing and malware, turn on security sandbox for all
    organisational units, or create security sandbox rules for high-risk groups if a full rollout
    affects delivery times.
  effort: S
  licence: [security-sandbox]
  sources: [gws-security-sandbox]
  refs:
    - { framework: nist-csf-2, ref: DE.CM-09 }

- id: GO-GML-005
  module: core
  domain: gmail
  appliesTo: [gw-gmail]
  severity: medium
  question: Is Gmail mailbox delegation restricted, with delegates on executive and finance mailboxes reviewed?
  why: >-
    A delegate can read and send from a mailbox. Attackers who compromise a mailbox add a delegate
    they control, or abuse an assistant's delegation to send fraudulent payment requests in an
    executive's name.
  yesLooksLike: >-
    Mail delegation is off except for organisational units with a business need (such as executive
    assistants), and delegates on executive, finance and shared mailboxes are reviewed at least
    quarterly.
  remediation: >-
    In Apps > Google Workspace > Gmail > User settings, turn mail delegation off by default and on
    only for the organisational units that need it. Review existing delegates through Gmail log
    events and remove any no longer required.
  effort: S
  sources: [gws-mail-delegation]
  refs:
    - { framework: cis-gws, ref: "3.1.3.1.1" }
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: idcf, ref: "DSL-3 Authorised person" }
