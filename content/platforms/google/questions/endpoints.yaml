    - { framework: ism, ref: ISM-1673 }
  e8:
    - { strategy: office-macros, level: 2 }

- id: GO-END-021
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: For users allowed to run Office macros, can only reviewed macros run, from a sandbox, a trusted location only reviewers can change, or signed by a trusted publisher with a V3 signature, with users unable to enable any other macro?
  why: >-
    Attackers sign malicious macros with home-made or stolen certificates and talk users into clicking
    Enable Content. Allowing only vetted macros from your own trusted publisher or a locked-down
    location takes that decision away from the user.
  yesLooksLike: >-
    For the macro-enabled group, only macros running in a sandboxed environment, from a trusted
    location, or digitally signed by a trusted publisher can run: VBA Macro Notification Settings is
    Disable all except digitally signed macros (or trusted locations or a sandbox are used instead),
    Only trust VBA macros that use V3 signatures is on, Trust Bar notifications for security issues are
    disabled so users can't enable other macros from the Message Bar or Backstage view, users can't add
    trusted publishers, and trusted documents are off. Someone independent of the author checks each
    macro for malicious code before it's signed or placed in a trusted location, only those privileged
    reviewers can write to trusted locations, and the trusted publisher list is revalidated at least
    yearly. Answer N/A if Microsoft Office isn't installed on any company computer, or macros are
    disabled for every user.
  remediation: >-
    Apply ASD's settings for the trusted publisher or trusted location approach with Group Policy,
    Intune or the Cloud Policy service, including Only trust VBA macros that use V3 signatures, turning
    off Trust Bar notifications and trusted documents, and blocking the Certificates snap-in and the
    Internet Options Content page so users can't add publishers. Use your own code-signing certificate
    as the trusted publisher where you can, write a macro review procedure with trained reviewers who
    don't write the macros, restrict write access on trusted locations to their privileged accounts, and
    diarise a yearly trusted publisher review.
  effort: M
  licence: []
  sources: [gws-office-files, ms-macros-internet, asd-restricting-office-macros, asd-e8-maturity-model]
