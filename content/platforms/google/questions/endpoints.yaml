    - { framework: ism, ref: ISM-1658 }
    - { framework: ism, ref: ISM-1659 }
  e8:
    - { strategy: application-control, level: 3 }

- id: GO-END-019
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: high
  question: Are Microsoft Office macros disabled for users without an approved business need, blocked in files from the internet, scanned by antivirus, and locked so users can't change these settings?
  why: >-
    Malicious macros in emailed or downloaded documents are still a common way to get code running on a
    computer, leading to ransomware or theft of the Google session signed in on it.
  yesLooksLike: >-
    Office policies set VBA Macro Notification Settings to Disable all without notification for everyone
    except a documented group with a business need, Block macros from running in Office files from the
    Internet is on, Macro Runtime Scan Scope is enabled with an antivirus product that scans macros, and
    the macro settings appear greyed out in the Trust Center. Answer N/A if Microsoft Office isn't
    installed on any company computer.
  remediation: >-
    Google's Admin console has no Office macro settings, so apply them with Group Policy, Intune or, for
    Microsoft 365 Apps for enterprise, the Cloud Policy service (it applies only privacy settings to
    Microsoft 365 Apps for business and doesn't apply to volume-licensed Office), and on Macs through
    your Apple device management service. Keep a record of approvals for the exception group, turn on
    Gmail's Security Sandbox (Business Standard and above) to scan Office attachments before delivery,
    and point staff who don't need desktop Office to Docs, Sheets and Slides, which don't run Office
    (VBA) macros.
  effort: M
  licence: []
