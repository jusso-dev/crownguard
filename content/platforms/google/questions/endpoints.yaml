    - { framework: ism, ref: ISM-1672 }
  e8:
    - { strategy: office-macros, level: 1 }

- id: GO-END-020
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: high
  question: Are Microsoft Office macros blocked from making Win32 API calls on Windows computers?
  why: >-
    Malicious macros call Windows programming interfaces directly to download malware, run it in memory
    or inject it into other programs. Blocking those calls stops a macro that slips past other controls
    from reaching beyond Office.
  yesLooksLike: >-
    The attack surface reduction rule Block Win32 API calls from Office macros is set to Block on every
    Windows computer with Office installed, with Microsoft Defender Antivirus active to enforce it (or
    another product blocks the same behaviour), and any exclusions are few and documented. Answer N/A if
    Microsoft Office isn't installed on any Windows computer.
  remediation: >-
    Add a Windows custom setting under Devices > Mobile & endpoints > Settings > Windows > Custom
    settings with the OMA-URI ./Vendor/MSFT/Policy/Config/Defender/AttackSurfaceReductionRules and the
    rule's GUID (92e97fa1-2edf-4476-bdd6-9dd0b4dddc7b) with the value 2 (audit) at first and 1 (block)
    once you've reviewed the events, or deploy the same rule with Group Policy or Intune.
  effort: S
  licence: [advanced-endpoint-management]
  sources: [gws-windows-common-custom-settings, ms-asr-rules, asd-restricting-office-macros, asd-e8-maturity-model]
