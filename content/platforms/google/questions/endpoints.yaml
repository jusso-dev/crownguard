  e8:
    - { strategy: user-application-hardening, level: 2 }

- id: GO-END-026
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Are Microsoft Office and every PDF reader hardened using ASD and vendor guidance, with Object Linking and Embedding package activation blocked and security settings users can't change?
  why: >-
    Office suites and PDF readers open files from strangers, and their defaults favour compatibility.
    Hardening switches off risky features such as embedded OLE packages, and locking the settings stops
    users, or an attacker coaching them, from turning protections back off.
  yesLooksLike: >-
    Office policies apply ASD's Office hardening guidance and Microsoft's security baseline, taking the
    stricter setting where they differ, including the PackagerPrompt setting that stops OLE packages
    from running, and Trust Center settings are greyed out. Every PDF reader installed, such as Adobe
    Acrobat Reader, is configured from ASD and its vendor's security guidance with its settings locked;
    Chrome's built-in viewer, with the PDF files policy locked, is enough on its own only where no other
    PDF software is installed. Parts for software you don't have don't apply. Answer N/A if neither
    Microsoft Office nor a separate PDF reader is installed on any company computer.
  remediation: >-
    Google's Admin console has no Office settings, so apply the settings in ASD's Hardening Microsoft
    365, Office 2021, Office 2019 and Office 2016 and Microsoft's security baseline with Group Policy,
    Intune or the Cloud Policy service, including PackagerPrompt set to 2 so OLE packages don't run.
    Standardise on Chrome's built-in PDF viewer (Devices > Chrome > Settings > Users & browsers > PDF
    files, without letting users override it) and remove other PDF readers, or harden each reader you
    keep from its vendor's security configuration guide and lock its settings. Staff who don't need
    desktop Office can open Office files in Docs, Sheets and Slides.
  effort: M
  licence: []
