    - { framework: ism, ref: ISM-1486 }
    - { framework: ism, ref: ISM-1654 }
  e8:
    - { strategy: user-application-hardening, level: 1 }

- id: GO-END-024
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: high
  question: Are Microsoft Defender attack surface reduction rules in block mode on Windows computers to stop Office starting other programs, creating executable content or injecting code, and to stop Adobe Reader starting other programs?
  why: >-
    Even an innocent-looking document can be weaponised. These rules stop what attackers do once a user
    opens a malicious file, such as Word launching PowerShell, Office writing an executable to disk or a
    PDF reader starting a command shell.
  yesLooksLike: >-
    Block all Office applications from creating child processes, Block Office communication application
    from creating child processes, Block Office applications from creating executable content, Block
    Office applications from injecting code into other processes and Block Adobe Reader from creating
    child processes are set to Block on every Windows computer, with few documented exclusions, and
    Microsoft Defender Antivirus, which enforces the rules, is active (or another product blocks the
    same behaviour, including for any other PDF reader). Rules for software that isn't installed can be
    left out. Answer N/A if no company computer runs Windows, or neither Microsoft Office nor a PDF
    reader other than the browser's built-in viewer is installed on Windows computers.
  remediation: >-
    Add a Windows custom setting under Devices > Mobile & endpoints > Settings > Windows > Custom
    settings with the OMA-URI ./Vendor/MSFT/Policy/Config/Defender/AttackSurfaceReductionRules, listing
    each rule's GUID with the value 2 (audit) at first and 1 (block) once you've reviewed the events, or
    deploy the same rules with Group Policy or Intune. Block executable content from email client and
    webmail is worth adding at the same time.
