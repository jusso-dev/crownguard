    Remove both features with Turn Windows features on or off, DISM or your deployment tool, keep
    Windows 11 and Windows Server up to date, and enforce application control script rules (for example
    the AppLocker Script rule collection as a Windows custom setting, or App Control for Business) so
    PowerShell automatically runs in Constrained Language Mode, while scripts your policy allows, such
    as signed administration scripts, still run.
  effort: M
