    - { framework: nist-csf-2, ref: DE.CM-09 }
    - { framework: ism, ref: ISM-1660 }
  e8:
    - { strategy: application-control, level: 2 }

- id: GO-END-018
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Do Windows and Mac computers load only approved kernel drivers and system extensions, with Microsoft's vulnerable driver blocklist turned on for Windows?
  why: >-
    Attackers bring signed but vulnerable drivers to switch off security tools from inside the operating
    system kernel. Restricting drivers to an approved set and blocking known-vulnerable ones closes that
    route.
  yesLooksLike: >-
    Windows computers have the Microsoft Vulnerable Driver Blocklist turned on and an App Control for
    Business policy that allows kernel drivers only from approved hardware and software vendors; Macs
    allow system and kernel extensions only from approved developers through device management;
    Chromebooks need nothing more because ChromeOS checks its system software at every start-up. Answer
    N/A if every company computer is a Chromebook.
  remediation: >-
    Check that Windows Security > Device security > Core isolation shows Microsoft Vulnerable Driver
    Blocklist turned on (or set it by policy), and deploy an App Control for Business policy with driver
    rules for your approved vendors through Group Policy, Intune or another tool that supports it.
    AppLocker, which Google's Windows custom settings examples use, can't restrict drivers. Turning on
    memory integrity as well is recommended, and ASD asks for it under restricting administrative
    privileges. On Macs, pre-approve only the system extensions you need through your Apple device
    management service.
  effort: L
  licence: []
  sources: [ms-app-control-driver-block-rules, ms-appcontrol-applocker-overview, gws-windows-block-apps, chromeos-auto-update-policy, asd-e8-maturity-model]
