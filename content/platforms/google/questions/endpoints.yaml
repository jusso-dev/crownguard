- id: GO-END-028
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Are .NET Framework 3.5 and Windows PowerShell 2.0 removed from Windows computers and servers, with PowerShell running in Constrained Language Mode?
  why: >-
    Old .NET and PowerShell versions lack modern security controls and logging, so attackers use them to
    slip past detection. Constrained Language Mode stops PowerShell reaching the .NET and Windows
    interfaces that attack tools depend on.
  yesLooksLike: >-
    The .NET Framework 3.5 (includes .NET 2.0 and 3.0) and Windows PowerShell 2.0 features aren't
    installed on any Windows computer or server (current Windows 11 and Windows Server 2025 releases no
    longer include PowerShell 2.0), and enforced AppLocker or App Control for Business script rules make
    PowerShell run in Constrained Language Mode for users, confirmed on a sample computer. Answer N/A if
    no company computer or server runs Windows.
