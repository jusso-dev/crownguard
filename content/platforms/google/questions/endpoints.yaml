- id: GO-END-027
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Are PowerShell module, script block and transcription logs and command line process creation events from Windows computers and servers collected centrally?
  why: >-
    Attackers lean on PowerShell and built-in command-line tools to move around without dropping obvious
    malware. Without these logs in a central place you can't see what they ran or show what they
    touched.
  yesLooksLike: >-
    Turn on Module Logging (all modules), Turn on PowerShell Script Block Logging and Turn on PowerShell
    Transcription are enabled, Audit Process Creation records successes with Include command line in
    process creation events on, and the PowerShell Operational log, transcripts and Security event 4688
    reach a SIEM such as Google Security Operations, or an EDR console, from every Windows computer and
    server. Answer N/A if no company computer or server runs Windows.
  remediation: >-
    Set the PowerShell logging and process creation audit policies with Group Policy, Intune or
    Microsoft's policy CSP settings through Windows custom settings, then forward the
    Microsoft-Windows-PowerShell/Operational log, transcript files and Security event 4688 to your SIEM,
    for example with the Bindplane agent for Google Security Operations, and check the events arrive. On
    Windows Server VMs in Google Cloud, the Ops Agent's built-in ingestion carries only
    Security-Auditing events such as 4688, so PowerShell logs and transcripts still need the Bindplane
    agent or another forwarder.
  effort: M
  licence: []
