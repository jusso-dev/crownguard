- id: GO-END-025
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Are Chrome and any other browsers hardened using Google's Chrome security configuration guide, vendor baselines and ASD guidance, taking the stricter setting where they differ?
  why: >-
    Default browser settings trade security for convenience. Hardening turns off features attackers
    abuse, such as risky downloads and site permissions, and enforces protections such as site isolation
    and stronger Safe Browsing for every user.
  yesLooksLike: >-
    The settings recommended in Google's Chrome Browser Enterprise Security Configuration Guide are
    applied as mandatory Chrome policies, for example Safe Browsing on with bypassing its warnings
    disabled, download restrictions for dangerous files and site isolation required for all websites;
    Microsoft Edge follows Microsoft's Edge security baseline and any other browser its vendor's
    hardening guidance; where ASD's guidance is stricter, its setting wins; and exceptions are
    documented.
  remediation: >-
    Work through Google's guide (the Workspace security checklist links to it) and set each
    recommendation under Devices > Chrome > Settings > Users & browsers, such as Safe Browsing
    Protection, Disable bypassing Safe Browsing warnings, Download restrictions and Site isolation.
    Compare it with the browser settings in ASD's Windows 11 workstation hardening guidance and keep the
    stricter option, apply the Microsoft Edge security baseline to Edge (for example through Intune
    security baselines or Group Policy), and record any exceptions.
  effort: M
  licence: []
  sources: [chrome-security-config-guide, chrome-user-browser-policies, gws-checklist-large, ms-intune-security-baselines, asd-windows-11-hardening, asd-e8-maturity-model]
