- id: GO-END-016
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Do application control rules on Windows and Mac computers cover every location on disk, include Microsoft's recommended block rules on Windows, and get revalidated at least once a year?
  why: >-
    Rules that only watch user folders can be bypassed from other writable locations, and built-in
    Windows tools such as mshta and msbuild can run attacker code unless they're blocked. Rule sets also
    drift as exceptions pile up and approved software or signing certificates go bad.
  yesLooksLike: >-
    Rules are publisher or hash based, or path rules allow only folders standard users can't write to,
    so no location is left uncovered; Microsoft's recommended block rules are in the Windows policy
    (natively in App Control for Business, or as equivalent AppLocker deny rules); the Mac tool has
    equivalent coverage; and a documented review at least yearly removes stale exceptions and rechecks
    approved applications and signing certificates. Answer N/A if every company computer is a
    Chromebook.
  remediation: >-
    Replace broad path rules with publisher or hash rules, check that no allowed path is writable by
    standard users, add Microsoft's recommended block rules, and update the AppLocker custom settings
    under Devices > Mobile & endpoints > Settings > Windows > Custom settings (or move to App Control
    for Business with a tool that can deploy it). Book a yearly ruleset review signed off by the system
    owner.
  effort: M
  licence: [advanced-endpoint-management]
  sources: [gws-windows-block-apps, ms-app-control-block-rules, asd-implementing-application-control, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-05 }
    - { framework: ism, ref: ISM-1544 }
    - { framework: ism, ref: ISM-1582 }
    - { framework: ism, ref: ISM-1871 }
  e8:
    - { strategy: application-control, level: 2 }

- id: GO-END-017
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Are allowed and blocked application control events from Windows and Mac computers collected centrally, in a SIEM or EDR console?
  why: >-
    Blocked attempts are an early sign that someone is trying to run malware, and allowed events show
    what actually ran during an incident. Events left on each laptop are lost when it's wiped or
    tampered with.
  yesLooksLike: >-
    Events from the AppLocker logs (EXE and DLL, MSI and Script, packaged apps) or App Control for
    Business, and the Mac allowlisting tool's allow and block events, reach a SIEM such as Google
    Security Operations or an EDR console from every computer, including allowed events, not just
    blocks. Answer N/A if every company computer is a Chromebook.
  remediation: >-
    Forward the AppLocker event logs (Application and Services Logs > Microsoft > Windows > AppLocker),
    or your App Control for Business events, with your SIEM agent, for example the Bindplane agent for
    Google Security Operations, or through your EDR product. Add the Mac tool's logs, size storage for
    the verbose EXE and DLL log, and confirm both allowed and blocked events arrive.
  effort: M
  licence: []
  sources: [gcp-secops-windows-events, ms-applocker-events, ms-app-control-events, asd-implementing-application-control, asd-e8-maturity-model]
