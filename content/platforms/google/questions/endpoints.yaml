- id: GO-END-022
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Are web advertisements blocked in Chrome and any other browser on company computers, through a force-installed ad-blocking extension or a web content filter?
  why: >-
    Malicious advertising runs on legitimate, popular websites and in search results, sending users to
    fake downloads and exploit pages without them visiting anywhere suspicious.
  yesLooksLike: >-
    A vetted ad-blocking extension is force-installed in Chrome and any other browser so users can't
    remove or disable it, or a DNS or web content filter blocks advertising domains for company
    computers on every network, and a test page shows ads are blocked. Chrome's Sites with intrusive ads
    setting and built-in pop-up blocking help, but on their own they don't block ads on most sites.
  remediation: >-
    Choose a content-blocking extension your organisation trusts, review its permissions like any other
    extension, and force-install it under Devices > Chrome > Apps & extensions > Users & browsers (it
    then applies on Chromebooks too), or use a DNS or secure web gateway service that blocks advertising
    wherever computers connect. Also set Sites with intrusive ads to block ads under Devices > Chrome >
    Settings > Users & browsers. Google describes Chrome's URL blocklist as basic URL management and
    recommends a content-filtering proxy or extension for stronger filtering.
  effort: S
  licence: []
  sources: [chrome-url-blocking, chrome-app-extension-policies, chrome-user-browser-policies, asd-e8-assessment-guide, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: google-security-guidance, ref: "Checklist: Chrome" }
    - { framework: ism, ref: ISM-1485 }
  e8:
    - { strategy: user-application-hardening, level: 1 }

- id: GO-END-023
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Is Internet Explorer 11 disabled or removed on Windows computers, and can no browser on company computers run Java from the internet?
  why: >-
    Internet Explorer 11 lost support in June 2022 yet can still be launched on some Windows versions,
    and old Java browser plug-ins were a favourite target of exploit kits. Either one gives attackers an
    easy way to run code from a web page.
  yesLooksLike: >-
    The Disable Internet Explorer 11 as a standalone browser policy is on for every Windows 10 computer
    (or the Internet Explorer feature is removed), a check confirms Internet Explorer can't be launched,
    and legacy intranet sites open in Edge's IE mode instead. Staff use current browsers such as Chrome,
    Edge and Safari, which can't run Java applets, and no old Java runtime or other browser that adds a
    Java plug-in remains. Windows 11, Macs and Chromebooks don't include the Internet Explorer 11
    desktop app, so only the Java part applies to them.
  remediation: >-
    Turn on Disable Internet Explorer 11 as a standalone browser with Group Policy, Intune or a Windows
    custom setting from Microsoft's InternetExplorer policy (DisableInternetExplorerApp) under Devices >
    Mobile & endpoints > Settings > Windows > Custom settings, optionally add an application control
    rule that blocks iexplore.exe, move legacy sites to Edge's IE mode, and uninstall old Java runtimes
    that add browser plug-ins.
  effort: S
  licence: [advanced-endpoint-management]
  sources: [gws-windows-custom-settings, chrome-npapi-removal, ms-edge-disable-ie11, asd-e8-assessment-guide, asd-e8-maturity-model]
