- id: GO-END-001
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints, gw-gmail, gw-drive]
  severity: high
  question: Are phones and tablets that access Workspace managed with advanced mobile management, including screen lock, encryption and remote wipe?
  why: >-
    With basic or no management, a lost or personal phone can hold years of email and synced files
    with no passcode requirement and no way to wipe them, and a compromised phone can leak session
    tokens.
  yesLooksLike: >-
    Mobile management is set to Advanced, devices need admin approval or a work profile before they
    sync, strong passcodes and encryption are required, compromised devices are blocked, and the
    company data on a lost device can be wiped.
  remediation: >-
    In Devices > Mobile & endpoints > Settings > Universal settings, set mobile management to
    Advanced and turn on device approvals. Require a strong passcode and encryption, block
    compromised devices, use Android work profiles and iOS managed apps, and document the
    lost-device wipe process.
  effort: M
  licence: [advanced-endpoint-management]
  sources: [gws-advanced-mobile, gws-offboarding]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: nist-csf-2, ref: ID.AM-01 }
    - { framework: google-security-guidance, ref: "Checklist: Endpoints" }
    - { framework: ism, ref: ISM-1195 }
    - { framework: ism, ref: ISM-0869 }
    - { framework: ism, ref: ISM-1887 }
    - { framework: ism, ref: ISM-1888 }
    - { framework: idcf, ref: "DSL-2 Physical" }
    - { framework: idcf, ref: "DSL-3 Physical" }
    - { framework: idcf, ref: "Whole system" }

- id: GO-END-002
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: high
  question: Are Chrome and any other browsers on company computers centrally managed with security settings that users cannot change?
  why: >-
    The browser is where staff use Workspace. Unmanaged Chrome lets users switch off Safe Browsing,
    sync work data into personal profiles and run outdated versions, and gives you no view of risky
    settings.
  yesLooksLike: >-
    Chrome on every Windows and Mac computer is enrolled in Chrome Enterprise Core, so its policies
    apply whichever profile is used, and Chromebooks are enrolled in the Admin console with sign-in
    restricted to managed accounts, so user policy always applies. Safe Browsing, browser sign-in
    restrictions and other security settings are enforced as mandatory policies that users cannot
    override, and any other browser, such as Microsoft Edge on Windows or Safari on Macs, is managed
    with its security settings locked, or blocked from use.
  remediation: >-
    Enrol Chrome browsers in Chrome Enterprise Core from the Admin console, enrol Chromebooks (this
    needs a ChromeOS Enterprise or Education Upgrade) and set the Sign-in restriction device setting to
    your managed accounts, then under Devices > Chrome > Settings > Users & browsers enforce Safe
    Browsing protection, restrict browser sign-in to managed accounts where appropriate and apply the
    other security settings in Google's Chrome guidance. Manage Microsoft Edge, which is built into
    Windows, with its policy templates through Group Policy or Intune, manage Safari through an Apple
    device management service, and remove any other browser you don't manage. Check the browser reports
    to confirm policies apply.
  effort: M
  sources: [chrome-policy-management, chromeos-device-policies, gws-checklist-large, asd-e8-assessment-guide]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: google-security-guidance, ref: "Checklist: Chrome" }
    - { framework: ism, ref: ISM-1585 }
  e8:
    - { strategy: user-application-hardening, level: 1 }

- id: GO-END-003
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints, gw-oauth-apps]
  severity: high
  question: Is Chrome extension installation limited to an approved list?
  why: >-
    Malicious and hijacked browser extensions can read every page a user opens, including Gmail and
    Drive, and steal session cookies that bypass 2-Step Verification. Popular extensions have been
    compromised through their developers' accounts.
  yesLooksLike: >-
    Chrome blocks all extensions by default except an allowlist (or blocks extensions requesting
    risky permissions), approved extensions are force-installed where needed, and the installed
    extension inventory is reviewed.
  remediation: >-
    Under Devices > Chrome > Apps & extensions > Users & browsers, block all apps and extensions by
    default, allowlist the ones the business approves (optionally letting users request others for
    review), and review installed extensions in the Chrome browser reports.
  effort: M
  sources: [chrome-extensions]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-05 }
    - { framework: ism, ref: ISM-1592 }

- id: GO-END-004
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: high
  question: Are Chrome browser and ChromeOS updates installed automatically, with relaunches forced within days of release?
  why: >-
    Browser and ChromeOS vulnerabilities are exploited quickly after patches ship, and users who
    never restart Chrome keep running vulnerable versions for weeks.
  yesLooksLike: >-
    Automatic updates are on and not pinned to old versions, relaunch notifications force a restart
    within a few days, ChromeOS devices auto-update and are retired before their Auto Update Expiration
    date, and the version reports show no Chrome browser more than two weeks behind and no ChromeOS
    device more than a month behind.
  remediation: >-
    Keep Chrome automatic updates on, set relaunch notification to required with a short period,
    configure ChromeOS device update settings to auto-update, track Auto Update Expiration dates for
    ChromeOS devices, and review the Chrome browser and ChromeOS version reports at least weekly so
    out-of-date browsers and devices are found and fixed.
  effort: S
  sources: [chrome-update-strategies, chromeos-updates, gws-checklist-large]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: nist-csf-2, ref: ID.RA-01 }
    - { framework: google-security-guidance, ref: "Checklist: Chrome" }
    - { framework: ism, ref: ISM-1691 }
    - { framework: ism, ref: ISM-1695 }
  e8:
    - { strategy: patch-applications, level: 1 }
    - { strategy: patch-operating-systems, level: 1 }

- id: GO-END-005
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: high
  question: Are company computers discovered automatically at least fortnightly and scanned for missing updates, weekly for browsers, office, email, PDF and security software and fortnightly for the operating system?
  why: >-
    You can't patch what you don't know is missing. Without automated discovery and scanning, forgotten
    laptops and out-of-date browsers, extensions, PDF readers and security agents go unnoticed until an
    attacker finds them. Google's Admin console lists computers and some versions, but it doesn't check
    third-party Windows or Mac software against vulnerability data.
  yesLooksLike: >-
    An automated discovery source (the scanner's own discovery, reconciled with the Admin console's
    endpoint and Chrome device lists) finds every company computer at least fortnightly. A vulnerability
    scanner whose vulnerability database is updated at least daily reports missing updates for browsers
    and their extensions, office, email and PDF software and security products at least weekly, and for
    the operating system at least fortnightly. Where the scanner can't assess Chromebooks or managed
    Chrome browsers, the Chrome browser and ChromeOS version reports are checked against Google's
    current releases at least weekly instead.
  remediation: >-
    Deploy a vulnerability scanner or endpoint vulnerability management tool that covers Windows and Mac
    computers (Google endpoint management doesn't scan third-party software for vulnerabilities),
    schedule weekly application scans and at least fortnightly operating system scans, and keep its
    vulnerability database updating daily. At least fortnightly, compare its asset list with the
    computers under Devices > Overview > Endpoints and the Chrome devices list and investigate any the
    scanner hasn't seen. Use Devices > Chrome > Reports > Versions for Chrome browsers and ChromeOS. On
    editions with advanced endpoint management, the installed apps list in each Windows computer's
    device details also helps spot software the scanner misses.
  effort: M
  licence: []
  sources: [gws-computer-details, chrome-version-report, asd-patching, asd-e8-assessment-guide, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: ID.AM-01 }
    - { framework: nist-csf-2, ref: ID.AM-02 }
    - { framework: nist-csf-2, ref: ID.RA-01 }
    - { framework: ism, ref: ISM-1699 }
    - { framework: ism, ref: ISM-1702 }
    - { framework: ism, ref: ISM-1807 }
  e8:
    - { strategy: patch-applications, level: 1 }
    - { strategy: patch-operating-systems, level: 1 }

- id: GO-END-006
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: high
  question: Are office, email and PDF software, security products, browser extensions and any browsers other than Chrome updated on company computers within two weeks of release, with unsupported versions removed?
  why: >-
    Office suites, email clients and PDF readers open files from strangers every day, so attackers move
    quickly on their flaws. Chrome updates itself, but Microsoft Office, PDF readers, other browsers and
    security agents each need their own update settings, and versions the vendor no longer supports
    never get fixed.
  yesLooksLike: >-
    Microsoft 365 Apps, where installed, update automatically from an update channel such as Current
    Channel or Monthly Enterprise Channel; PDF readers, email clients (including Google Workspace Sync
    for Microsoft Outlook, with Google Update's auto-updates left on), other browsers, browser
    extensions and security agents update automatically or IT deploys their updates within two weeks;
    the scanner shows none more than two weeks behind; and nothing past its end of support remains, such
    as Office 2016, Office 2019, Adobe Flash Player or an abandoned extension. Answer N/A if every
    company computer is a Chromebook.
  remediation: >-
    For Windows computers in Google's Windows device management, go to Devices > Mobile & endpoints >
    Settings > Windows > Windows Update settings, turn on Accept updates for Microsoft applications and
    choose an automatic install behaviour. Keep Microsoft 365 Apps on an automatically updating channel,
    turn on the built-in updaters (or deploy updates with your software tool) for PDF readers, other
    browsers and security agents, and use the installed apps list in each Windows computer's device
    details to find old versions and uninstall unsupported ones. Google endpoint management doesn't
    manage software on Macs, so update Mac apps through an Apple device management service or each app's
    own updater.
  effort: M
  licence: [advanced-endpoint-management]
  sources: [gws-windows-updates, gws-computer-details, gws-computers-overview, gws-gwsmo-updates, ms-m365-apps-channels, ms-eos-2025, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: ism, ref: ISM-1691 }
    - { framework: ism, ref: ISM-1704 }
  e8:
    - { strategy: patch-applications, level: 1 }

- id: GO-END-007
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: high
  question: Are Windows and macOS updates installed on company computers within one month of release, and are computers on operating systems their vendor no longer supports replaced?
  why: >-
    Operating system flaws give malware full control of a computer and of the Google session signed in
    on it. Chromebooks update themselves, but Windows and Mac computers need enforced update settings,
    and an operating system past its end of support gets no security fixes at all.
  yesLooksLike: >-
    Windows computers are in Google's Windows device management with Windows Update set to install
    automatically and a Receive quality updates restart deadline short enough that updates finish well
    within a month, Macs install macOS updates within a month through an Apple device management
    service, the scanner shows no computer more than a month behind, and no computer runs an unsupported
    release, such as Windows 10 outside the Extended Security Updates program. Where Context-Aware
    Access is available, an access level also blocks Windows and macOS versions below your minimum.
    Answer N/A if every company computer is a Chromebook.
  remediation: >-
    Turn on Windows device management and, under Devices > Mobile & endpoints > Settings > Windows >
    Windows Update settings, enable Windows Update with Auto install and restart (or Auto install and
    notify before restart) and set the Receive quality updates restart deadline to a few days. Google
    endpoint management only inventories Macs, so enforce macOS updates through an Apple device
    management service. On editions with Context-Aware Access, create an access level with a minimum
    Windows and macOS version and assign it to Workspace apps. Replace Windows 10 computers, or enrol
    them in Extended Security Updates until they're replaced.
  effort: M
  licence: [advanced-endpoint-management]
  sources: [gws-windows-updates, gws-computers-overview, gws-caa-access-levels, ms-win10-esu, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: nist-csf-2, ref: ID.AM-08 }
    - { framework: ism, ref: ISM-1501 }
    - { framework: ism, ref: ISM-1695 }
  e8:
    - { strategy: patch-operating-systems, level: 1 }

- id: GO-END-008
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Are all other applications on company computers scanned at least fortnightly for missing updates and updated within one month of release?
  why: >-
    Attackers don't only target browsers and Office. Meeting clients, compression tools, runtimes and
    line-of-business software have exploited flaws too, and they often sit unpatched for months because
    nobody owns their updates.
  yesLooksLike: >-
    A vulnerability scanner checks every other installed application, such as meeting clients,
    compression tools, runtimes and line-of-business software, for missing updates at least fortnightly,
    and each one updates itself or IT deploys its updates within one month of release, so the scanner
    shows nothing more than a month behind. Answer N/A if every company computer is a Chromebook with no
    Android apps.
  remediation: >-
    Extend the vulnerability scanner to all installed software with at least fortnightly scans, turn on
    each application's own updater or redeploy current installers (Windows custom settings can install
    MSI packages on computers in Windows device management), and review the installed apps list in each
    Windows computer's device details for software nobody manages. Removing software nobody needs leaves
    less to patch.
  effort: M
  licence: [advanced-endpoint-management]
  sources: [gws-computer-details, gws-windows-install-apps, asd-patching, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: nist-csf-2, ref: ID.RA-01 }
    - { framework: ism, ref: ISM-1693 }
    - { framework: ism, ref: ISM-1700 }
  e8:
    - { strategy: patch-applications, level: 2 }

- id: GO-END-009
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: high
  question: Are updates that fix critical or actively exploited vulnerabilities in browsers and their extensions, office, email, PDF and security software installed on company computers within 48 hours of release?
  why: >-
    Once a fix for an exploited flaw is public, attackers study it and go after computers that haven't
    installed it, often within a day. Waiting for a monthly cycle or a week-long relaunch prompt leaves
    that window open, and skilled attackers rely on it.
  yesLooksLike: >-
    Chrome's relaunch notification forces a relaunch within 24 hours of an update, so Chrome runs a
    critical fix within 48 hours (on Chromebooks this also needs the Stable channel, because the
    long-term support channels can wait months for some security fixes); Microsoft 365 Apps, PDF
    readers, other browsers and security agents get urgent updates through update deadlines or forced
    deployments that land within 48 hours; and someone watches vendor advisories and CISA's Known
    Exploited Vulnerabilities catalogue so critical fixes are pushed the day they're released. Other
    fixes for this software still arrive within two weeks.
  remediation: >-
    Under Devices > Chrome > Settings > Users & browsers > Chrome updates, set Relaunch notification to
    Force relaunch after a period of 24 hours or less (relaunches are aimed at 2am to 4am local time,
    which can lengthen the countdown). Use update deadlines for Microsoft 365 Apps (for example Cloud
    Update's deadlines, Intune or Group Policy), turn on automatic updates with short deadlines for PDF
    readers, other browsers and security agents, and subscribe to Chrome Releases, Microsoft, Adobe and
    ASD security alerts so you can push an urgent update the day it ships.
  effort: M
  licence: []
  sources: [chrome-relaunch-notification, chromeos-lts, ms-m365-apps-cloud-update-deadlines, asd-patching, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: google-security-guidance, ref: "Checklist: Chrome" }
    - { framework: ism, ref: ISM-1692 }
  e8:
    - { strategy: patch-applications, level: 3 }

- id: GO-END-010
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: high
  question: Are operating system updates that fix critical or actively exploited vulnerabilities installed on company computers within 48 hours of release?
  why: >-
    Operating system flaws that are already being exploited give an attacker full control of a computer
    and the Google session on it. A monthly patch cycle, a pinned ChromeOS version or a slow restart
    leaves those computers open for weeks after the fix exists.
  yesLooksLike: >-
    Chromebooks follow the Stable channel with no pinned target version or long staged rollout, and the
    relaunch notification restarts them to apply updates within 48 hours (devices on the LTS or LTC
    channels don't meet this, because Google says some security fixes can take up to 9 months to reach
    LTS); Windows computers have a Receive quality updates restart deadline of one day or less, with
    urgent updates pushed outside the normal cycle; Macs get urgent macOS updates with a deadline of 48
    hours or less through an Apple device management service; and someone watches vendor advisories so
    urgent fixes are pushed the day they're released. Other operating system fixes still install within
    one month.
  remediation: >-
    Under Devices > Chrome > Settings > Device settings > Device update settings, keep auto-updates on
    the Stable channel with no target version and no long rollout plan, and set Relaunch notification so
    devices restart within 24 hours of an update. Under Devices > Mobile & endpoints > Settings >
    Windows > Windows Update settings, set the Receive quality updates restart deadline to one day or
    less. Set short update deadlines for Macs in your Apple device management service, and subscribe to
    Chrome Releases, Microsoft, Apple and ASD security alerts.
  effort: M
  licence: [advanced-endpoint-management, chromeos-device-management]
  sources: [chromeos-updates, chromeos-lts, chrome-relaunch-notification, gws-windows-updates, asd-patching, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: ism, ref: ISM-1696 }
  e8:
    - { strategy: patch-operating-systems, level: 3 }

- id: GO-END-011
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Do company computers run the latest or previous release of their operating system?
  why: >-
    Older operating system releases lack newer security features and are the first to lose fixes.
    Determined attackers look for computers left behind on them.
  yesLooksLike: >-
    Windows computers run the current or previous Windows 11 feature update (Windows 10 computers have
    been upgraded or replaced), Macs run the current or previous major macOS release, and Chromebooks
    run the current or previous ChromeOS version on the Stable channel, or the current or previous
    milestone of the long-term support channel (LTS or LTC) they're assigned to, with no target version
    holding them further back. Version reports and your device management tools show no exceptions.
  remediation: >-
    Schedule Windows feature updates so no computer falls more than one release behind and replace
    hardware that can't run a supported release, require macOS upgrades through your Apple device
    management service, remove ChromeOS target version pins under Devices > Chrome > Settings > Device
    settings > Device update settings, and raise the minimum operating system versions in any
    Context-Aware Access levels as new releases ship.
  effort: L
  licence: []
  sources: [chromeos-lts, chromeos-updates, gws-caa-access-levels, gws-computers-overview, ms-windows11-release-info, asd-e8-faq, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: nist-csf-2, ref: ID.AM-08 }
    - { framework: ism, ref: ISM-1407 }
  e8:
    - { strategy: patch-operating-systems, level: 3 }

- id: GO-END-012
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Have all applications their vendors no longer support been removed from company computers, including utilities, runtimes and line-of-business software?
  why: >-
    Software past its end of support never gets another security fix, so every flaw found in it stays
    open for good. Old runtimes, compression tools and retired business clients are easy to forget and
    easy for an attacker to exploit.
  yesLooksLike: >-
    The vulnerability scanner's end-of-life report and the installed apps lists show no application past
    its vendor's end of support, such as an old Java runtime, compression tool or retired
    line-of-business client; anything that can't be removed yet has a dated replacement plan, and the
    answer is Partial until it's gone. Answer N/A if every company computer is a Chromebook with no
    Android apps.
  remediation: >-
    Turn on your scanner's end-of-life or unsupported software reporting, review the installed apps list
    in each Windows computer's device details for old software, uninstall what isn't needed with your
    software deployment tool, and plan replacements for business software that has lost support. Remove
    Android apps and extensions on Chromebooks that are no longer published or updated.
  effort: M
  licence: []
  sources: [gws-computer-details, asd-patching, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: nist-csf-2, ref: ID.AM-08 }
    - { framework: ism, ref: ISM-0304 }
  e8:
    - { strategy: patch-applications, level: 3 }

- id: GO-END-013
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Are driver and firmware updates for company computers checked at least fortnightly and installed within one month of release, or within 48 hours when critical or actively exploited?
  why: >-
    Vulnerable drivers and firmware give attackers control below the operating system, where it survives
    a reinstall and hides from security tools. Vendors fix them regularly, but they're often left out of
    normal patching.
  yesLooksLike: >-
    Chromebooks get hardware updates automatically as part of ChromeOS updates; Windows computers get
    driver updates from Windows Update (drivers aren't excluded) and BIOS or UEFI firmware updates
    through the manufacturer's management tool or Windows Update; the scanner or manufacturer's tool
    reports missing driver and firmware updates for Windows and Mac computers at least fortnightly; and
    critical fixes are installed within 48 hours.
  remediation: >-
    Keep ChromeOS auto-updates on. For Windows, check that no policy excludes drivers from Windows
    Update, deploy the computer manufacturer's update tool with central reporting for BIOS, UEFI and
    driver updates, add driver and firmware checks to the scanner's fortnightly schedule, and push
    critical firmware fixes within 48 hours. Keep Macs on current macOS updates through your Apple
    device management service, since Apple delivers Mac firmware in macOS updates.
  effort: M
  licence: []
  sources: [chromeos-auto-update-policy, gws-windows-updates, asd-patching, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: nist-csf-2, ref: PR.PS-03 }
    - { framework: ism, ref: ISM-1703 }
    - { framework: ism, ref: ISM-1879 }
    - { framework: ism, ref: ISM-1900 }
    - { framework: ism, ref: ISM-1903 }
  e8:
    - { strategy: patch-operating-systems, level: 3 }

- id: GO-END-014
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: high
  question: Is application control enforced on Windows and Mac computers, at least in user profile and temporary folders, so only an approved set of programs, libraries, scripts and installers can run from them?
  why: >-
    Ransomware, remote access tools and infostealers that steal Google session cookies usually arrive as
    a file someone downloads or opens into their own folders. Application control stops anything that
    isn't on the approved list from running there, even when a user is tricked into launching it.
  yesLooksLike: >-
    Windows computers enforce AppLocker or App Control for Business (or a third-party allowlisting
    product), not just audit, so that in the user profile and temporary folders used by Windows,
    browsers and email clients (including Downloads and the user and Windows temporary folders) only
    executables, libraries, scripts, installers, compiled HTML, HTML applications and control panel
    applets on an approved list, identified by publisher, hash or a protected path, can run. Macs run an
    application allowlisting tool in enforcement mode covering the same locations. Answer N/A if every
    company computer is a Chromebook.
  remediation: >-
    For Windows computers in Google's Windows device management, build AppLocker rule collections for
    EXE, MSI, Script and DLL files and add each one as a custom setting under Devices > Mobile &
    endpoints > Settings > Windows > Custom settings, using the AppLocker ApplicationLaunchRestrictions
    OMA-URIs. Google's allow-all-signed-apps example isn't an approved set, so write publisher rules for
    the vendors you approve, run in audit mode first, then enforce, and block mshta.exe and hh.exe
    unless they're needed. Microsoft prefers App Control for Business, which also controls drivers,
    where your tools can deploy it. Google endpoint management doesn't control Mac apps, so deploy an
    allowlisting tool through an Apple device management service. Extending the rules to every location
    is the next step.
  effort: L
  licence: [advanced-endpoint-management]
  sources: [gws-windows-block-apps, gws-computers-overview, ms-appcontrol-applocker-overview, asd-implementing-application-control, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-05 }
    - { framework: ism, ref: ISM-0843 }
    - { framework: ism, ref: ISM-1657 }
    - { framework: ism, ref: ISM-1870 }
  e8:
    - { strategy: application-control, level: 1 }

- id: GO-END-015
  module: core
  domain: endpoints
  appliesTo: [gw-endpoints]
  severity: medium
  question: Are Chromebooks limited to approved apps and extensions, with developer mode, the Linux development environment and Android app sideloading kept off?
  why: >-
    ChromeOS checks its own system software at every start-up, but users can still add risk. An unvetted
    Android app or extension can read their data, and developer mode or the Linux development
    environment lets them run programs outside ChromeOS's protections.
  yesLooksLike: >-
    For every organisational unit with Chromebook users, Chrome Web Store and Google Play installs are
    blocked except for an approved list (force-installed where needed), Chromebooks are enrolled with
    forced re-enrolment on so developer mode stays disabled, Linux virtual machines are blocked, and ADB
    sideloading of Android apps is prevented. If approved developers have Linux turned on, the answer is
    Partial unless the Linux environment has its own application control. Answer N/A if no one uses a
    Chromebook.
  remediation: >-
    Enrol Chromebooks (enrolment needs a ChromeOS Enterprise or Education Upgrade licence). Under
    Devices > Chrome > Apps & extensions, set the Chrome Web Store and Google Play to allow only the
    apps and extensions you approve, the same allowlist you use for Chrome browsers. Under Devices >
    Chrome > Settings > Device settings, keep forced re-enrolment on (it disables developer mode) and
    keep Prevent users of this device from using ADB sideloading. Leave Linux virtual machines set to
    block under Users & browsers, and review installed apps and extensions in the Chrome reports.
