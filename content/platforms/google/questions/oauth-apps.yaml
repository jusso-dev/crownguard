- id: GO-APP-001
  module: core
  domain: oauth-apps
  appliesTo: [gw-oauth-apps, gw-gmail, gw-drive, gw-gemini]
  severity: high
  question: Are users prevented from granting unreviewed third-party apps access to Gmail, Drive and other Workspace data?
  why: >-
    Consent phishing tricks a user into authorising a malicious app, which then reads their mail and
    files through Google's APIs without needing the password or 2-Step Verification. The token keeps
    working until someone revokes it.
  yesLooksLike: >-
    Under Security > Access and data control > API controls, unconfigured third-party apps are
    limited to Google sign-in only (or blocked), Gmail and Drive are Restricted services, apps you
    approve are deliberately marked Trusted or Limited, and Marketplace installs are limited to an
    allowlist.
  remediation: >-
    In API controls, set Unconfigured third-party apps to allow only apps that ask for Google
    sign-in information (or block them), mark Gmail, Drive and Docs and other sensitive services as
    Restricted under Manage Google services, review Accessed apps and set the ones you approve to
    Trusted or Limited, and allow only allowlisted Marketplace apps.
  effort: M
  sources: [gws-app-access-control, gws-marketplace-allowlist, gws-checklist-large]
  refs:
    - { framework: cis-gws, ref: "4.2.1.1" }
    - { framework: cis-gws, ref: "3.1.9.1.1" }
    - { framework: nist-csf-2, ref: PR.PS-05 }
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: google-security-guidance, ref: "Checklist: Apps" }
    - { framework: idcf, ref: "Rule 1" }

- id: GO-APP-002
  module: core
  domain: oauth-apps
  appliesTo: [gw-oauth-apps]
  severity: medium
  question: Do you review the third-party apps holding access to Workspace data at least every six months and remove ones no longer needed?
  why: >-
    Apps approved years ago may since have been abandoned, sold or breached, yet their tokens still
    hold broad access to mail and files. Compromised SaaS integrations are a common route to bulk
    data theft.
  yesLooksLike: >-
    A recorded review of Accessed apps and Configured apps (users, scopes and verification status)
    happens on a schedule, each trusted app has a business owner, and unused apps are blocked.
  remediation: >-
    In API controls > Manage third-party app access, export the Accessed apps list, check each app's
    scopes and user count, confirm a business owner, block anything unneeded, and record the
    review. Use OAuth log events to see which apps are actually being used.
  effort: S
  sources: [gws-app-access-control, gws-checklist-large]
  refs:
    - { framework: cis-gws, ref: "4.2.1.2" }
    - { framework: nist-csf-2, ref: ID.AM-04 }
    - { framework: nist-csf-2, ref: GV.SC-07 }
    - { framework: google-security-guidance, ref: "Checklist: Apps" }
    - { framework: idcf, ref: "Rule 1" }

- id: GO-APP-003
  module: core
  domain: oauth-apps
  appliesTo: [gw-oauth-apps, gcp-service-accounts, gw-gmail, gw-drive]
  severity: critical
  question: Is every domain-wide delegation client known, owned and limited to the narrowest scopes it needs?
  why: >-
    A service account with domain-wide delegation can act as any user, executives included, with no
    password or 2-Step Verification. If its key leaks, an attacker can read every mailbox and file in
    the organisation.
  yesLooksLike: >-
    Every client ID under API controls > Domain-wide delegation has a named owner, a documented
    purpose and narrow scopes (for example read-only Calendar rather than full Gmail), unused clients
    have been deleted, and the backing service accounts have no downloadable keys.
  remediation: >-
    Review the domain-wide delegation list at least twice a year, delete unused clients, cut scopes
    to the minimum, and trace each client ID to its Google Cloud service account to confirm who
    controls it and that it has no user-managed keys. Turn on multi-party approval so new
    delegations need a second super admin.
  effort: M
  sources: [gws-domain-wide-delegation, gcp-sa-key-best-practices]
  refs:
    - { framework: cis-gws, ref: "4.2.1.4" }
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: google-security-guidance, ref: "Checklist: Apps" }
    - { framework: idcf, ref: "Rule 1" }

- id: GO-APP-004
  module: core
  domain: oauth-apps
  appliesTo: [gw-oauth-apps, gw-gmail, gw-drive]
  severity: high
  question: Are OAuth grants made by or through AI agents reviewed, using the "By an agent" attribute in the OAuth log events?
  why: >-
    An AI agent can request access on a person's behalf, or hold and use it long after the person
    clicked Allow, so the grant isn't a considered human decision. Google's OAuth log events record
    which grants were made by an agent; reviewing them is the only way to see access that no one
    deliberately chose.
  yesLooksLike: >-
    The OAuth log events report is run regularly with the "By an agent" and "Agent info" attributes
    shown, every grant made by or through an agent is checked against what the agent does with the
    data and who operates it, its scopes are the narrowest that work, and grants that aren't needed
    are revoked.
  remediation: >-
    In the Admin console under Reporting, Audit and investigation, OAuth log events, add the "By an
    agent" and "Agent info" attributes and review every grant flagged as made by an agent. Check each
    agent's scopes against its purpose and its operator, revoke what isn't needed, and add
    agent-made grants to the standing app review.
  effort: M
  sources: [gws-oauth-log-events, gws-app-access-control]
  refs:
    - { framework: cis-gws, ref: "4.2.1.2" }
    - { framework: cis-gws, ref: "5.1.1.1" }
    - { framework: nist-csf-2, ref: GV.SC-07 }
    - { framework: google-security-guidance, ref: "Checklist: Apps" }
    - { framework: idcf, ref: "Rule 1" }

- id: GO-APP-005
  module: core
  domain: oauth-apps
  appliesTo: [gw-oauth-apps, gw-gmail, gw-drive]
  severity: medium
  question: Is there an alert on new grants to apps that hold mail, file or meeting-transcript scopes?
  why: >-
    A new grant to an app with Gmail, Drive or Meet transcript scopes is how shadow AI starts: the
    app can read what your organisation writes from that moment on. An alert turns a silent grant
    into a decision someone has to make.
  yesLooksLike: >-
    A rule under Security, Rules (or a scheduled security investigation tool or BigQuery query) fires
    when an app gains Gmail, Drive or Meet transcript scopes it didn't hold before, the alert reaches
    the alert centre and a named owner, and someone reviews the apps the alerts surface.
  remediation: >-
    Create a rule for OAuth log events where the event is a grant and the scope includes Gmail, Drive
    or meetings.readonly, or schedule the same query in the security investigation tool or a BigQuery
    export of the log events. Send the results to the alert centre or your own queue, assign an owner,
    and record the review.
  effort: M
  sources: [gws-activity-rules, gws-investigation-tool, gws-oauth-log-events]
  refs:
    - { framework: cis-gws, ref: "5.1.1.1" }
    - { framework: nist-csf-2, ref: DE.CM-03 }
    - { framework: nist-csf-2, ref: DE.AE-02 }
    - { framework: idcf, ref: "Rule 1" }
