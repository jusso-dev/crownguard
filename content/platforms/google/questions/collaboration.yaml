- id: GO-COL-001
  module: core
  domain: collaboration
  appliesTo: [gw-collaboration]
  severity: medium
  question: Is Google Chat with people outside the organisation limited to allowlisted domains?
  why: >-
    Open external chat lets anyone with a Google account message staff directly, a phishing route
    that skips email filtering, and lets staff move files out through external spaces.
  yesLooksLike: >-
    External chat is off or limited to allowlisted partner domains, external spaces are restricted,
    and external file sharing in Chat is off.
  remediation: >-
    In Apps > Google Workspace > Google Chat > External Chat Settings, turn external chat off or
    select "Only allow this for allowlisted domains", restrict external spaces, and turn off
    external file sharing in Chat.
  effort: S
  sources: [gws-chat-external, gws-checklist-large]
  refs:
    - { framework: cis-gws, ref: "3.1.4.1.1" }
    - { framework: cis-gws, ref: "3.1.4.2.1" }
    - { framework: cis-gws, ref: "3.1.4.3.1" }
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: google-security-guidance, ref: "Checklist: Google Chat" }
    - { framework: idcf, ref: "Sharing agreement" }

- id: GO-COL-002
  module: core
  domain: collaboration
  appliesTo: [gw-collaboration, gw-oauth-apps]
  severity: medium
  question: Are users prevented from installing Chat apps or adding incoming webhooks without review?
  why: >-
    Chat apps and webhooks can read messages in the spaces they join or post content that looks
    legitimate. An unreviewed bot can collect sensitive discussions or deliver phishing links inside
    trusted spaces.
  yesLooksLike: >-
    "Allow users to install Chat apps" and "Allow users to add and use incoming webhooks" are off,
    or Chat apps are limited to those on the Marketplace allowlist.
  remediation: >-
    In Apps > Google Workspace > Google Chat > Chat apps settings, turn off user installation of
    Chat apps and incoming webhooks, and allow specific approved apps through the Marketplace
    allowlist.
  effort: S
  sources: [gws-chat-apps, gws-marketplace-allowlist]
  refs:
    - { framework: cis-gws, ref: "3.1.4.4.1" }
    - { framework: cis-gws, ref: "3.1.4.4.2" }
    - { framework: nist-csf-2, ref: PR.PS-05 }
    - { framework: idcf, ref: "Rule 1" }

- id: GO-COL-003
  module: core
  domain: collaboration
  appliesTo: [gw-collaboration, gw-tenant, gw-drive]
  severity: medium
  question: Are Google Groups private to the organisation, with group creation restricted?
  why: >-
    Groups often grant access to shared drives, apps and Google Cloud projects. Groups that
    outsiders can see or join, or that anyone can create, leak membership and conversations and
    become a back door into resources.
  yesLooksLike: >-
    Access to groups from outside the organisation is private, only admins or a defined set of users
    can create groups, the default permission to view conversations is limited to members, and
    groups that grant access are labelled as security groups.
  remediation: >-
    In Apps > Google Workspace > Groups for Business > Sharing settings, set access from outside the
    organisation to private, restrict who can create groups, limit default conversation viewing to
    group members, and apply the security label to groups used for access control.
  effort: S
  sources: [gws-groups-policies, gws-checklist-large]
  refs:
    - { framework: cis-gws, ref: "3.1.6.1" }
    - { framework: cis-gws, ref: "3.1.6.2" }
    - { framework: cis-gws, ref: "3.1.6.3" }
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: google-security-guidance, ref: "Checklist: Google Groups" }
    - { framework: idcf, ref: "DSL-2 Authorised person" }

- id: GO-COL-004
  module: core
  domain: collaboration
  appliesTo: [gw-collaboration]
  severity: low
  question: Is external calendar sharing limited to free/busy information, with warnings when external guests are invited?
  why: >-
    Executive calendars reveal deals, travel, board meetings and who is talking to whom. Attackers
    use these details to time and tailor fraud and phishing.
  yesLooksLike: >-
    External sharing for primary and secondary calendars shows only free/busy information, and users
    are warned when they invite guests from outside the organisation.
  remediation: >-
    In Apps > Google Workspace > Calendar > Sharing settings, set external sharing for primary and
    secondary calendars to "Only free/busy information (hide event details)" and turn on external
    invitation warnings.
  effort: S
  sources: [gws-calendar-sharing, gws-checklist-large]
  refs:
    - { framework: cis-gws, ref: "3.1.1.1.1" }
    - { framework: cis-gws, ref: "3.1.1.1.3" }
    - { framework: cis-gws, ref: "3.1.1.2.1" }
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: google-security-guidance, ref: "Checklist: Calendar" }

- id: GO-MEET-001
  module: core
  domain: collaboration
  appliesTo: [gw-collaboration]
  severity: medium
  question: Are people outside your organisation kept out of Google Meet meetings unless an organiser invites them?
  why: >-
    An uninvited guest can listen in on discussions about deals, incidents or staff. Attackers join
    open meetings to harvest names and topics for later phishing, and guessing or forwarding a
    meeting link is often all it takes.
  yesLooksLike: >-
    Guests who were not invited must ask to join and be admitted by the host, your users cannot join
    meetings created outside a Google Workspace tenant, host management is on so hosts control who
    joins and can mute or remove people, and users are warned when an external participant is in a
    meeting.
  remediation: >-
    In Apps > Google Workspace > Google Meet > Meeting settings, turn on host management, require
    people outside your organisation to ask to join or be invited, turn on the warning for external
    participants, and stop users joining meetings created outside a Google Workspace tenant.
  effort: S
  sources: [gws-meet-settings, gws-meet-access]
  refs:
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: idcf, ref: "Sharing agreement" }

- id: GO-MEET-002
  module: core
  domain: collaboration
  appliesTo: [gw-collaboration]
  severity: medium
  question: Are automatic recording and transcription of Google Meet meetings turned off by default?
  why: >-
    A recording or transcript captures what people actually say, including salary talks, incident
    calls and client matters. When one starts automatically, nobody decides whether it should
    exist, who will keep it, or who it might reach.
  yesLooksLike: >-
    Automatic recording and automatic transcription are off organisation-wide, hosts start
    recording or transcribing deliberately when it is needed, and participants are told when it
    happens.
  remediation: >-
    In Apps > Google Workspace > Google Meet, under Recording & transcription and the automatic
    meeting artifact settings, turn off automatic recording and automatic transcription for the
    organisational units that don't need them, and brief hosts to record deliberately.
  effort: S
  sources: [gws-meet-recording, gws-meet-transcription, gws-meet-artifacts]
  refs:
    - { framework: nist-csf-2, ref: PR.DS-01 }
    - { framework: idcf, ref: "Sharing agreement" }

- id: GO-MEET-003
  module: core
  domain: collaboration
  appliesTo: [gw-collaboration]
  severity: high
  question: Is access to Google Meet recordings, transcripts and AI meeting notes limited to the people who need them?
  why: >-
    Recordings and transcripts are full records of sensitive conversations, saved in Drive where
    normal sharing rules apply. A loosely shared link to last month's board call is a crown-jewel
    leak with no sign of who has opened it.
  yesLooksLike: >-
    Recordings and transcripts land in a place your Drive sharing rules cover, the default sharing
    for AI meeting notes is restricted to people in your organisation, administrators cannot
    override a stricter default with a looser one, and sharing of individual recordings is
    reviewed.
  remediation: >-
    In Apps > Google Workspace > Google Meet, restrict the default sharing level for meeting notes
    and AI notes to your organisation, stop administrators overriding it, keep recordings in shared
    drives with reviewed membership rather than personal Drive, and review who has access to
    sensitive recordings. Access to recordings and transcripts themselves is set through Drive
    sharing, so your Drive rules do the work.
  effort: M
  sources: [gws-meet-artifacts, gws-meet-recording]
  refs:
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: nist-csf-2, ref: PR.DS-01 }
    - { framework: idcf, ref: "Sharing agreement" }
