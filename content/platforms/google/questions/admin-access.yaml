- id: GO-ADM-001
  module: core
  domain: admin-access
  appliesTo: [gw-super-admins]
  severity: high
  question: Are there between two and four super admin accounts, each assigned to one named person?
  why: >-
    A single super admin is a single point of failure if that person is unavailable or locked out.
    Many super admins multiply the accounts an attacker can phish to gain total control, and shared
    accounts make it impossible to tell who did what.
  yesLooksLike: >-
    Filtering Directory > Users by Admin role > Super admin shows two to four accounts, each tied to
    one named individual, and the list is reviewed at least quarterly.
  remediation: >-
    Filter the user list by the Super admin role. Remove the role from anyone who does not need it
    and give them a delegated role instead, make sure at least two named people hold it, and never
    share a super admin account between people.
  effort: S
  sources: [gws-admin-best-practices, gcp-super-admin]
  refs:
    - { framework: cis-gws, ref: "1.1.1" }
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: google-security-guidance, ref: "Admin accounts: Super admins" }
    - { framework: ism, ref: ISM-0414 }
    - { framework: ism, ref: ISM-1883 }
    - { framework: idcf, ref: "DSL-2 Authorised person" }

- id: GO-ADM-002
  module: core
  domain: admin-access
  appliesTo: [gw-super-admins]
  severity: critical
  question: Do super admins and other high-privilege admins use separate admin accounts that are never used for email, browsing or daily work?
  why: >-
    An admin account used for everyday email and web browsing meets every phishing message and
    malicious site its owner does. A separate account used only for administration shrinks that
    exposure dramatically.
  yesLooksLike: >-
    Each administrator has a normal account for daily work and a separate privileged account (for
    example jane.admin@) with Gmail and other non-essential services turned off and no third-party
    app grants, and admins sign out of it when finished.
  remediation: >-
    Create dedicated admin accounts, move admin roles onto them and remove roles from daily
    accounts. Place the admin accounts in their own organisational unit with Gmail, Drive and other
    unneeded services turned off and third-party app access blocked, and ask admins to sign out
    when not administering.
  effort: M
  sources: [gws-admin-best-practices, gws-checklist-large, gcp-super-admin]
  refs:
    - { framework: cis-gws, ref: "1.1.2" }
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: google-security-guidance, ref: "Admin accounts: Super admins" }
    - { framework: ism, ref: ISM-0445 }
    - { framework: ism, ref: ISM-1175 }
  e8:
    - { strategy: restrict-admin-privileges, level: 1 }

- id: GO-ADM-003
  module: core
  domain: admin-access
  appliesTo: [gw-super-admins, gcp-org-iam]
  severity: critical
  question: Are all administrator accounts required to sign in with security keys or passkeys?
  why: >-
    Admin accounts are the keys to the whole tenant and to any linked Google Cloud organisation.
    They are targeted with real-time phishing that defeats codes and prompts, and only
    phishing-resistant methods stop it.
  yesLooksLike: >-
    Admin accounts sit in an organisational unit where 2-Step Verification is enforced with "Only
    security key", each admin has at least two registered keys or passkeys, and super admins are
    enrolled in the Advanced Protection Program.
  remediation: >-
    Put admin accounts in their own organisational unit, enforce 2-Step Verification there with the
    "Only security key" method, issue each admin two FIDO2 keys (one stored safely as a spare), and
    enable Advanced Protection Program enrolment under Security > Authentication > Advanced
    Protection Program for super admins and other high-risk users.
  effort: M
  sources: [gws-admin-best-practices, gws-deploy-2sv, gws-advanced-protection, gcp-super-admin]
  refs:
    - { framework: cis-gws, ref: "4.1.1.1" }
    - { framework: cis-gws, ref: "4.1.1.2" }
    - { framework: cis-gws, ref: "4.1.3.1" }
    - { framework: cis-gcp, ref: "1.4" }
    - { framework: nist-csf-2, ref: PR.AA-03 }
    - { framework: google-security-guidance, ref: "Admin accounts: Protect" }
    - { framework: ism, ref: ISM-1173 }
    - { framework: ism, ref: ISM-1682 }
  e8:
    - { strategy: mfa, level: 2 }

- id: GO-ADM-004
  module: core
  domain: admin-access
  appliesTo: [gw-super-admins, gw-vault-retention]
  severity: high
  question: Is routine administration done through delegated admin roles that grant only the privileges each job needs?
  why: >-
    If help desk staff, Vault users or app managers are made super admins for convenience, any one
    of their accounts can be used to take over the tenant. Narrow roles limit what a compromised
    admin account can do.
  yesLooksLike: >-
    Help desk, user management, groups, services and Vault tasks use prebuilt or custom admin roles,
    scoped to the relevant organisational units where possible, and super admin is reserved for
    tasks only it can perform.
  remediation: >-
    Review Account > Admin roles. Assign prebuilt roles such as Help Desk Admin, User Management
    Admin, Groups Admin or Services Admin, or custom roles with only the privileges needed, scope
    them to organisational units, and remove super admin from anyone who can work with less.
  effort: M
  sources: [gws-admin-roles, gws-admin-best-practices]
  refs:
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: google-security-guidance, ref: "Admin accounts: Super admins" }
    - { framework: ism, ref: ISM-1508 }
  e8:
    - { strategy: restrict-admin-privileges, level: 3 }

- id: GO-ADM-005
  module: core
  domain: admin-access
  appliesTo: [gw-super-admins]
  severity: high
  question: Is self-service password recovery turned off for super admin accounts?
  why: >-
    Self-recovery lets anyone who controls a super admin's recovery phone or email reset its
    password. SIM-swap and recovery-mailbox takeovers turn that convenience into a route to full
    tenant control.
  yesLooksLike: >-
    Under Security > Authentication > Account recovery, super admin account recovery is turned off,
    and super admins regain access through another super admin instead.
  remediation: >-
    In Security > Authentication > Account recovery, turn off super admin account recovery. Make
    sure at least two super admins exist so one can reset the other, and that the break-glass
    account's credentials are stored securely.
  effort: S
  sources: [gws-super-admin-recovery, gcp-super-admin]
  refs:
    - { framework: cis-gws, ref: "4.1.2.1" }
    - { framework: nist-csf-2, ref: PR.AA-01 }
    - { framework: google-security-guidance, ref: "Admin accounts: Super admins" }
    - { framework: ism, ref: ISM-1593 }

- id: GO-ADM-006
  module: core
  domain: admin-access
  appliesTo: [gw-super-admins, gw-federation]
  severity: high
  question: Is there a documented break-glass super admin account that still works if your identity provider or normal admins are unavailable?
  why: >-
    If SSO breaks, admins are locked out or an attacker removes your administrators, you need a
    guaranteed way back in. Without one, recovery depends on proving domain ownership to Google in
    the middle of a crisis.
  yesLooksLike: >-
    A named emergency super admin exists that does not depend on SSO, has a long unique password and
    at least two security keys stored in separate secure locations, has backup codes in a safe, is
    never used day to day, raises an alert whenever it signs in, and is tested at least yearly.
  remediation: >-
    Create a dedicated emergency super admin, keep it out of third-party SSO, register two security
    keys and store them and printed backup codes in separate safes, document the procedure, and
    create an alert on any sign-in by the account. Test access at least annually.
  effort: S
  sources: [gws-admin-best-practices, gcp-super-admin]
  refs:
    - { framework: nist-csf-2, ref: PR.AA-01 }
    - { framework: nist-csf-2, ref: RC.RP-01 }
    - { framework: google-security-guidance, ref: "Admin accounts: Recovery" }
    - { framework: ism, ref: ISM-1610 }
  e8:
    - { strategy: restrict-admin-privileges, level: 2 }

- id: GO-ADM-007
  module: core
  domain: admin-access
  appliesTo: [gw-super-admins, gw-tenant, gw-oauth-apps]
  severity: medium
  question: Is multi-party approval turned on so sensitive security changes need a second super admin to approve them?
  why: >-
    One compromised or rogue super admin can quietly switch off 2-Step Verification, change SSO,
    grant domain-wide delegation or export mailboxes from Vault. A second approver stops one account
    making those changes alone.
  yesLooksLike: >-
    "Require multi-party approval for sensitive actions" is on under Security > Authentication >
    Multi-party approval settings, and approvers verify each request with the requester before
    approving.
  remediation: >-
    Turn on multi-party approval in Security > Authentication > Multi-party approval settings (it
    needs at least two super admins), and agree an out-of-band check, such as a phone call, that
    approvers use before approving a request.
  effort: S
  licence: [multi-party-approval]
  sources: [gws-multi-party-approval, gws-domain-wide-delegation]
  refs:
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: idcf, ref: "DSL-4 Authorised person" }

- id: GO-ADM-008
  module: core
  domain: admin-access
  appliesTo: [gw-super-admins, gcp-org-iam]
  severity: medium
  question: Are admin role assignments revalidated at least every 12 months and removed after 45 days without use?
  why: >-
    Admin rights accumulate as people change jobs. Forgotten or unused admin accounts are prime
    targets because nobody notices when they are misused.
  yesLooksLike: >-
    A recorded review at least yearly confirms every admin role holder in Workspace and every
    organisation-level Google Cloud role still needs it, and admin accounts unused for 45 days are
    suspended or have their roles removed.
  remediation: >-
    Export admin role assignments from Account > Admin roles (and organisation-level IAM bindings in
    Google Cloud), confirm each with the person's manager, remove stale assignments, and use last
    sign-in data and IAM role recommendations to find admin access unused for 45 days.
  effort: S
  sources: [gws-admin-roles, gws-admin-best-practices, gcp-role-recommendations]
  refs:
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: ism, ref: ISM-1647 }
    - { framework: ism, ref: ISM-1648 }
    - { framework: idcf, ref: "DSL-3 Authorised person" }
  e8:
    - { strategy: restrict-admin-privileges, level: 2 }

- id: GO-ADM-009
  module: core
  domain: admin-access
  appliesTo: [gw-super-admins, gcp-org-iam]
  severity: medium
  question: Is every request for an admin role checked and approved by someone accountable, other than the requester, before the role is assigned?
  why: >-
    Admin roles handed out on a casual request, or assigned by the person asking for them, are how
    privileges creep beyond what anyone intended. Validating each request when it's first made ties
    every admin role to a real, approved need.
  yesLooksLike: >-
    Requests for Workspace admin roles and organisation-level Google Cloud roles go through a ticket or
    approval workflow, a named approver other than the requester confirms the business need before the
    role is assigned, and approvals are recorded so each role assignment can be traced to an approved
    request.
  remediation: >-
    Name an approver for each admin role and route requests through your ticketing system. On editions
    with multi-party approval, also require it for role assignment and role privilege changes under
    Security > Authentication > Multi-party approval settings, use Privileged Access Manager approvals
    for Google Cloud roles, and compare new role assignments in the Admin log events against approved
    requests.
  effort: S
  licence: []
  sources: [gws-multi-party-approval, gws-assign-admin-roles, gcp-pam]
  refs:
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: ism, ref: ISM-1507 }
  e8:
    - { strategy: restrict-admin-privileges, level: 1 }

- id: GO-ADM-010
  module: core
  domain: admin-access
  appliesTo: [gw-super-admins, gw-endpoints]
  severity: high
  question: Do administrators use their admin accounts only on a separate admin device or environment that their everyday accounts can't sign in to?
  why: >-
    An admin account signed in on the computer used for everyday email and browsing meets every
    malicious link and download that computer does. A separate admin environment stops a compromised
    everyday device from capturing admin sessions.
  yesLooksLike: >-
    Admins sign in to their admin accounts only in designated admin environments, such as a ChromeOS
    device whose sign-in restriction allows only admin accounts; everyday accounts can't sign in to
    those devices; and admin accounts can't be used on everyday devices, for example because a
    Context-Aware Access policy limits the Google Admin console to the designated devices.
  remediation: >-
    Give each administrator a separate admin environment, use the ChromeOS Sign-in restriction device
    setting to allow only admin accounts on admin devices, apply a Context-Aware Access policy to the
    Google Admin console for the admin organisational unit that requires those devices, and make clear
    that admin accounts are never used on everyday devices.
  effort: M
  licence: [context-aware-access, chromeos-device-management]
  sources: [chromeos-device-policies, gws-context-aware-access]
  refs:
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: ism, ref: ISM-1380 }
    - { framework: ism, ref: ISM-1688 }
  e8:
    - { strategy: restrict-admin-privileges, level: 1 }

- id: GO-ADM-011
  module: core
  domain: admin-access
  appliesTo: [gw-super-admins, gw-endpoints]
  severity: medium
  question: Is each administrator's admin environment kept off their everyday device, rather than running as a virtual machine inside it?
  why: >-
    An admin virtual machine running on an everyday laptop is only as safe as that laptop. Malware on
    the host can read the screen and capture keystrokes, so the admin session inherits every risk of the
    device used for email and browsing.
  yesLooksLike: >-
    No administrator's admin environment is a virtual machine hosted on the device they use for email
    and browsing; admin work happens on dedicated devices, such as ChromeOS devices restricted to admin
    accounts, or on a separately managed host that everyday accounts can't reach.
  remediation: >-
    Move admin virtual machines off everyday devices onto dedicated admin devices, for example ChromeOS
    devices limited to admin accounts with the Sign-in restriction setting, and record the approved
    admin environment for each administrator.
  effort: M
  licence: [chromeos-device-management]
  sources: [chromeos-device-policies, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: ism, ref: ISM-1687 }
  e8:
    - { strategy: restrict-admin-privileges, level: 2 }

- id: GO-ADM-012
  module: core
  domain: admin-access
  appliesTo: [gw-super-admins, gw-endpoints]
  severity: high
  question: Do administrators carry out admin work only from dedicated, hardened admin devices that are used for nothing else?
  why: >-
    Admins are the people attackers most want to phish or infect. A device used only for administration,
    with everything else locked down, leaves an attacker far fewer ways to steal an admin session or
    plant malware on the machine that holds it.
  yesLooksLike: >-
    Each administrator has a dedicated admin device, such as an enrolled ChromeOS device restricted to
    admin accounts with apps, extensions and browsing limited to what admin work needs; a Context-Aware
    Access policy requires those devices for the Google Admin console; and admin accounts aren't used on
    any other device.
  remediation: >-
    Issue dedicated admin devices, enrol them in a separate organisational unit, restrict sign-in to
    admin accounts, block unneeded apps and extensions and limit browsing to admin sites, then require
    those devices for the Google Admin console with a Context-Aware Access policy for the admin
    organisational unit.
  effort: L
  licence: [context-aware-access, chromeos-device-management]
  sources: [chromeos-device-policies, gws-context-aware-access, chrome-extensions]
  refs:
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: ism, ref: ISM-1898 }
  e8:
    - { strategy: restrict-admin-privileges, level: 3 }

- id: GO-ADM-013
  module: core
  domain: admin-access
  appliesTo: [gw-super-admins]
  severity: medium
  question: Are high-privilege Workspace admin roles assigned only for a limited time when they're needed, rather than held permanently?
  why: >-
    A permanently assigned admin role gives an attacker full power the moment they compromise the
    account, at any hour. Roles granted for a set period and removed automatically shrink that window
    and leave a record of who had access when.
  yesLooksLike: >-
    Apart from the primary admin and the break-glass account, super admin and other high-privilege roles
    are assigned with an expiration after an approved request, they're removed automatically when the
    period ends, and standing assignments are limited to roles needed every day.
  remediation: >-
    On the Admin roles page, assign high-privilege roles for a specific duration (Change expiration)
    instead of permanently, tie each assignment to an approved request, and convert existing standing
    assignments to time-limited ones as they're reviewed. Use Privileged Access Manager for the matching
    Google Cloud roles.
  effort: M
  licence: []
  sources: [gws-assign-admin-roles, gcp-pam]
  refs:
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: google-security-guidance, ref: "Admin accounts: Super admins" }
    - { framework: ism, ref: ISM-1649 }
  e8:
    - { strategy: restrict-admin-privileges, level: 3 }
