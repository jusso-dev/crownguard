id: microsoft
name: Microsoft 365 & Entra ID
vendor: Microsoft
description: >-
  Microsoft 365 tenants and their Microsoft Entra ID identity plane: Exchange Online, SharePoint,
  OneDrive, Teams, Purview, Intune-managed devices, Microsoft 365 Copilot and agents, with an
  optional Azure module for cloud security posture (Azure access, data stores and keys, networks and
  workloads, monitoring and guardrails).


# Licence tiers below are based on these vendor pages.
sources: [ms-m365-pricing-packaging-2026, ms-nonprofit-faq, ms-nonprofit-offerings]

modules:
  - id: core
    name: Microsoft 365 & Entra ID
    description: The tenant, identities, admin roles, collaboration workloads, data protection, devices, Copilot and backups.
    optional: false
  - id: azure
    name: Azure
    description: >-
      Cloud security posture for Azure: management groups and subscriptions, role assignments, workload
      identities and service provider access, storage, databases, disks and Key Vault, networks, VMs, AKS,
      App Service and AI services, Defender for Cloud, logging, Azure Policy and Azure Backup.
    optional: true

# Base plans only. Add-ons (Copilot, SharePoint Advanced Management, Microsoft 365 Backup,
# Workload Identities, Defender for Cloud, Defender CSPM, Sentinel) are not part of any tier, so questions that
# need them always show the licence gap. Business Premium includes Defender for Business, which
# provides endpoint detection and response comparable to Defender for Endpoint Plan 2 for
# organisations of up to 300 users, so it is mapped to defender-endpoint-p2.
# Nonprofit tiers are the discounted "Nonprofit Staff Pricing" versions of the same plans and
# carry the same security features. Business Basic is the only remaining broad grant (up to 300
# users); the Business Premium and Office 365 E1 grants were retired on 1 July 2025, and Office 365
# E1 is now discounted (grants only in limited Enterprise Agreement scenarios). Office 365 E1
# includes no listed security features: sensitivity labels and Purview DLP start at Office 365 E3.
licenceTiers:
  - id: business-basic
    name: Microsoft 365 Business Basic
    features: []
  - id: business-basic-nonprofit
    name: Microsoft 365 Business Basic (Nonprofit grant)
    features: []
  - id: business-standard
    name: Microsoft 365 Business Standard
    features: []
  - id: business-standard-nonprofit
    name: Microsoft 365 Business Standard (Nonprofit)
    features: []
  - id: business-premium
    name: Microsoft 365 Business Premium
    features:
      - entra-p1
      - intune
      - defender-office-p1
      - defender-endpoint-p1
      - defender-endpoint-p2
      - purview-labels
      - purview-dlp
  - id: business-premium-nonprofit
    name: Microsoft 365 Business Premium (Nonprofit)
    features:
      - entra-p1
      - intune
      - defender-office-p1
      - defender-endpoint-p1
      - defender-endpoint-p2
      - purview-labels
      - purview-dlp
  - id: office-365-e1-nonprofit
    name: Office 365 E1 (Nonprofit)
    features: []
  - id: office-365-e3
    name: Office 365 E3
    features:
      - m365-apps-enterprise  # desktop Office managed by policy (Apps for business ignores policies)
      - defender-office-p1  # included from 1 Aug 2026 (ms-m365-pricing-packaging-2026)
      - purview-labels
      - purview-dlp
  - id: office-365-e3-nonprofit
    name: Office 365 E3 (Nonprofit)
    features:
      - m365-apps-enterprise  # desktop Office managed by policy (Apps for business ignores policies)
      - defender-office-p1  # included from 1 Aug 2026 (ms-m365-pricing-packaging-2026)
      - purview-labels
      - purview-dlp
  - id: microsoft-365-e3
    name: Microsoft 365 E3
    features:
      - m365-apps-enterprise  # desktop Office managed by policy (Apps for business ignores policies)
      - defender-office-p1  # included from 1 Aug 2026 (ms-m365-pricing-packaging-2026)
      - entra-p1
      - intune
      - defender-endpoint-p1
      - purview-labels
      - purview-dlp
  - id: microsoft-365-e3-nonprofit
    name: Microsoft 365 E3 (Nonprofit)
    features:
      - m365-apps-enterprise  # desktop Office managed by policy (Apps for business ignores policies)
      - defender-office-p1  # included from 1 Aug 2026 (ms-m365-pricing-packaging-2026)
      - entra-p1
      - intune
      - defender-endpoint-p1
      - purview-labels
      - purview-dlp
  - id: microsoft-365-e3-e5-security
    name: Microsoft 365 E3 + E5 Security add-on
    features:
      - m365-apps-enterprise  # desktop Office managed by policy (Apps for business ignores policies)
      - entra-p1
      - entra-p2
      - intune
      - defender-office-p1
      - defender-office-p2
      - defender-endpoint-p1
      - defender-endpoint-p2
      - defender-identity
      - defender-cloud-apps
      - purview-labels
      - purview-dlp
  - id: microsoft-365-e5
    name: Microsoft 365 E5
    features:
      - m365-apps-enterprise  # desktop Office managed by policy (Apps for business ignores policies)
      - entra-p1
      - entra-p2
      - intune
      - defender-office-p1
      - defender-office-p2
      - defender-endpoint-p1
      - defender-endpoint-p2
      - defender-identity
      - defender-cloud-apps
      - purview-labels
      - purview-auto-labelling
      - purview-dlp
      - purview-dlp-advanced
      - purview-audit-premium
  - id: microsoft-365-e5-nonprofit
    name: Microsoft 365 E5 (Nonprofit)
    features:
      - m365-apps-enterprise  # desktop Office managed by policy (Apps for business ignores policies)
      - entra-p1
      - entra-p2
      - intune
      - defender-office-p1
      - defender-office-p2
      - defender-endpoint-p1
      - defender-endpoint-p2
      - defender-identity
      - defender-cloud-apps
      - purview-labels
      - purview-auto-labelling
      - purview-dlp
      - purview-dlp-advanced
      - purview-audit-premium

licenceFeatures:
  - id: entra-p1
    name: Microsoft Entra ID P1 (Conditional Access)
  - id: entra-p2
    name: Microsoft Entra ID P2 (PIM, ID Protection, access reviews)
  - id: entra-workload-id
    name: Microsoft Entra Workload ID (add-on)
  - id: intune
    name: Microsoft Intune Plan 1
  - id: m365-apps-enterprise
    name: Microsoft 365 Apps for enterprise (Office settings enforceable by policy)
  - id: defender-office-p1
    name: Defender for Office 365 Plan 1 (Safe Links, Safe Attachments)
  - id: defender-office-p2
    name: Defender for Office 365 Plan 2 (priority accounts, AIR, attack simulation)
  - id: defender-endpoint-p1
    name: Defender for Endpoint Plan 1 (next-gen protection, ASR rules)
  - id: defender-endpoint-p2
    name: Defender for Endpoint Plan 2 or Defender for Business (EDR, automated investigation)
  - id: defender-identity
    name: Microsoft Defender for Identity
  - id: defender-cloud-apps
    name: Microsoft Defender for Cloud Apps
  - id: purview-labels
    name: Purview sensitivity labels (manual labelling)
  - id: purview-auto-labelling
    name: Purview automatic and default labelling
  - id: purview-dlp
    name: Purview DLP for Exchange, SharePoint and OneDrive
  - id: purview-dlp-advanced
    name: Purview DLP for Teams, endpoints and Copilot (E5 / E5 Compliance)
  - id: purview-audit-premium
    name: Purview Audit (Premium)
  - id: sharepoint-advanced-management
    name: SharePoint Advanced Management (add-on, or included with Microsoft 365 Copilot)
  - id: copilot
    name: Microsoft 365 Copilot (add-on)
  - id: m365-backup
    name: Microsoft 365 Backup (pay-as-you-go)
  - id: sentinel
    name: Microsoft Sentinel (consumption)
  - id: defender-for-cloud
    name: Microsoft Defender for Cloud plans (Azure)
  # Billed per Azure resource like the other Defender for Cloud plans, so like defender-for-cloud it is not part of
  # any tier. Foundational CSPM (free) gives recommendations and secure score; attack path analysis, critical
  # assets, cloud security explorer and data security posture need the paid Defender CSPM plan (ms-mdc-cspm).
  - id: defender-cspm
    name: Microsoft Defender CSPM plan (Azure, paid)

domains:
  - id: identity
    name: Identity & Conditional Access
    description: How people sign in, the MFA methods they use and the conditions under which access is granted.
  - id: privileged-access
    name: Privileged access
    description: Admin roles, emergency access accounts, admin workstations, partners and the hybrid identity servers that control the tenant.
  - id: apps-consent
    name: Apps & consent
    description: App registrations, service principals and the permissions users and admins grant to third-party apps.
  - id: data-protection
    name: Data protection
    description: Knowing where sensitive information lives and protecting it with sensitivity labels and data loss prevention.
  - id: sharepoint-onedrive
    name: SharePoint & OneDrive
    description: Sharing settings and oversharing of documents and sites.
  - id: exchange-email
    name: Exchange & email
    description: Mailbox exposure, legacy protocols, email authentication and phishing protection.
  - id: teams-collab
    name: Teams & collaboration
    description: External chat, guest membership and apps in Microsoft Teams.
  - id: endpoints
    name: Endpoints
    description: Device management, Office macros, application control, patching and endpoint detection.
  - id: copilot-ai
    name: Copilot & AI agents
    description: What Microsoft 365 Copilot can surface, and who can build and run agents.
  - id: logging-detection
    name: Logging & detection
    description: Audit logs, retention, alerting and who responds when something is detected.
  - id: backup-recovery
    name: Backup & recovery
    description: Recovering Microsoft 365 data after ransomware, malicious deletion or a rogue administrator.
  - id: azure-identity
    name: Azure access and identities
    description: Azure role assignments, just-in-time access, elevated access, MFA for Azure management, service provider access, and the managed identities and service principals workloads run as.
  - id: azure-data
    name: Azure data and keys
    description: Exposure, authentication, secrets, recoverability and backups of storage accounts, databases, disks and Key Vault.
  - id: azure-network
    name: Azure network and workloads
    description: Internet exposure of virtual machines and web apps, and the hardening and patching of VMs, AKS, App Service, container registries and AI services.
  - id: azure-logging
    name: Azure monitoring and guardrails
    description: Defender for Cloud, attack paths, activity and resource logs, flow logs, alerts, Azure Policy and resource locks.
