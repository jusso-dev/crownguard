- id: MS-DP-001
  module: core
  domain: data-protection
  appliesTo: [ms-sensitive-data, ms-sharepoint-sites, ms-exchange-mailboxes]
  severity: high
  question: Are sensitivity labels published to all users and applied to the documents and emails that make up your crown jewels?
  why: >-
    You cannot protect what you cannot find. Labels make sensitivity visible to people, travel with
    the file when it leaves SharePoint, and are the signal that DLP, Copilot and Defender use to
    apply protection.
  yesLooksLike: >-
    A short label taxonomy (for example Public, General, Confidential, Highly Confidential) is
    published to all users in the Office apps, a default label is set, and content in crown-jewel
    sites and mailboxes is labelled, with label activity visible in Purview.
  remediation: >-
    Agree a simple taxonomy with business owners, create and publish labels in the Microsoft Purview
    portal, set a default label and require justification to downgrade, then label crown-jewel
    locations using default library labels or, with E5, automatic labelling policies.
  effort: M
  licence: [purview-labels]
  sources: [ms-labels-get-started, ms-sensitivity-labels, ms-zt-data]
  refs:
    - { framework: cis-m365, ref: "3.3.1" }
    - { framework: nist-csf-2, ref: ID.AM-07 }
    - { framework: nist-csf-2, ref: PR.DS-01 }
    - { framework: mcsb, ref: DP-1 }
    - { framework: ms-zero-trust, ref: Data I }
    - { framework: idcf, ref: Labels }
  essentials:
    - { action: IT.IDE-01.2, domains: [BUS], coverage: partial }
    - { action: CL.IDE-01.x3, domains: [BUS], coverage: partial }

- id: MS-DP-002
  module: core
  domain: data-protection
  appliesTo: [ms-sensitive-data, ms-sharepoint-sites, ms-exchange-mailboxes]
  severity: high
  question: Does your most sensitive label apply encryption so that only authorised people can open the content, even after it leaves the tenant?
  why: >-
    Encryption in the label protects the file itself. A forwarded attachment, a file copied to a USB
    stick or a document a former employee kept cannot be opened by the wrong person, and access can
    be revoked later.
  yesLooksLike: >-
    The Highly Confidential (or equivalent) label applies encryption with permissions limited to
    named groups, it is used on board, HR, legal and finance content, and Copilot and DLP policies
    respect it.
  remediation: >-
    Configure encryption on top-tier labels with permissions assigned to specific groups rather than
    any authenticated user, test with key external partners, enable co-authoring for encrypted
    files, and apply the label to crown-jewel libraries.
  effort: M
  licence: [purview-labels]
  sources: [ms-sensitivity-labels, ms-zt-data]
  refs:
    - { framework: nist-csf-2, ref: PR.DS-01 }
    - { framework: mcsb, ref: DP-1 }
    - { framework: ms-zero-trust, ref: Data II }
    - { framework: idcf, ref: Movement }
  essentials:
    - { action: CL.PRO-08.x1, domains: [CPS], coverage: partial }
  essentialsReviewed: "No enterprise IT action covers encryption, as the IT chapter has no cryptography principle, so only the cloud action is tagged."

- id: MS-DP-003
  module: core
  domain: data-protection
  appliesTo: [ms-sensitive-data, ms-exchange-mailboxes, ms-sharepoint-sites, ms-teams]
  severity: high
  question: Do data loss prevention policies detect and block sharing of your regulated information, such as tax file numbers, Medicare numbers and payment card data, in email, SharePoint and OneDrive?
  why: >-
    People routinely email or share spreadsheets of personal information by mistake. DLP catches it
    at the point of sharing and gives you evidence for breach assessments.
  yesLooksLike: >-
    DLP policies covering Exchange, SharePoint and OneDrive (and Teams where licensed) use the
    Australian sensitive information types and your own custom types, block external sharing of
    high-volume matches with policy tips, and alerts are reviewed.
  remediation: >-
    Start from the Purview DLP templates for Australian privacy and financial data, run them in
    simulation mode, tune false positives, then enforce with policy tips and override justification.
    Extend to Teams chat, endpoints and Copilot with E5 or E5 Compliance licences.
  effort: M
  licence: [purview-dlp]
  sources: [ms-dlp, ms-purview-licensing]
  refs:
    - { framework: cis-m365, ref: "3.2.1" }
    - { framework: cis-m365, ref: "3.2.2" }
    - { framework: nist-csf-2, ref: PR.DS-01 }
    - { framework: nist-csf-2, ref: PR.DS-02 }
    - { framework: mcsb, ref: DP-2 }
    - { framework: ms-zero-trust, ref: Data IV }
    - { framework: idcf, ref: Movement }
    - { framework: idcf, ref: "DSL-4 Authorised person" }
  essentials:
    - { action: IT.PRO-09.1, domains: [BUS], coverage: partial }
    - { action: CL.PRO-09.x2, domains: [BUS], coverage: partial }

- id: MS-DP-004
  module: core
  domain: data-protection
  appliesTo: [ms-sharepoint-sites, ms-teams, ms-exchange-mailboxes, ms-sensitive-data]
  severity: medium
  question: Does a data loss prevention policy find passwords, keys and tokens stored in SharePoint, OneDrive and email, and alert someone who gets them removed and changed?
  why: >-
    Passwords, API keys and connection strings end up in documents, spreadsheets and emails, where
    anyone who gets into a mailbox or site can find them with a simple search. Attackers look for them
    straight after getting in, because they open systems that MFA doesn't protect.
  yesLooksLike: >-
    A Purview DLP policy uses the All credentials sensitive information type (or the individual
    credential types) across Exchange, SharePoint and OneDrive, and Teams where licensed; matches raise
    alerts to a named owner; and each finding leads to the secret being moved to a vault and changed,
    not just the file being deleted.
  remediation: >-
    In the Microsoft Purview portal, create a DLP policy for Exchange email, SharePoint sites and
    OneDrive accounts (and Teams chat and channel messages if you have the licence) that detects the
    All credentials sensitive information type. Start in simulation mode to tune it, then turn on alerts
    or incident reports to the team that owns secrets. For each match, rotate the credential, store it
    in a password manager or key vault, and remove the copy.
  effort: M
  licence: [purview-dlp]
  sources: [ms-sit-all-credentials, ms-dlp]
  refs:
    - { framework: nist-csf-2, ref: PR.DS-01 }
    - { framework: mcsb, ref: IM-8 }
    - { framework: ism, ref: ISM-1875 }
  essentials:
    - { action: IT.PRO-13.3, domains: [VR], coverage: partial }
    - { action: CL.PRO-13.x1, domains: [VR], coverage: partial }
