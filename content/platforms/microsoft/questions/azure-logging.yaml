- id: MS-AZ-035
  module: azure
  domain: azure-logging
  appliesTo: [ms-azure-subscriptions, ms-azure-data-stores, ms-azure-workloads, ms-azure-key-vault]
  severity: medium
  question: Do Azure Policy assignments at management group scope enforce your security baseline on every subscription, including the Microsoft cloud security benchmark with none of its policies disabled?
  why: >-
    Without guardrails, every new subscription and resource starts from whatever its creator chose.
    Policies assigned high in the management group hierarchy stop public storage, open ports and
    missing logs being deployed in the first place, including in subscriptions created later.
  yesLooksLike: >-
    Production subscriptions sit under a management group hierarchy, not directly under the root;
    the Microsoft cloud security benchmark is assigned (as Defender for Cloud's default standard) with
    no non-deprecated policies set to Disabled; and Deny or DeployIfNotExists policies at management
    group scope block or fix the highest-risk settings, with exemptions documented and time-limited.
  remediation: >-
    Build a management group hierarchy (for example platform, production and non-production), move
    subscriptions into it, check the Microsoft cloud security benchmark assignment in Defender for
    Cloud's security policies and re-enable any disabled policies, and assign Deny policies for public
    network access, anonymous blob access and management ports from the internet after testing them
    in Audit mode.
  effort: M
  licence: []
  sources: [ms-azure-policy, ms-azure-management-groups, ms-mdc-security-policy, ms-mdc-manage-mcsb]
  refs:
    - { framework: cis-azure, ref: "8.1.11" }
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: PV-1 }
    - { framework: mcsb, ref: PV-2 }
    - { framework: ms-zero-trust, ref: Infrastructure IV }

- id: MS-AZ-036
  module: azure
  domain: azure-logging
  appliesTo: [ms-azure-data-stores, ms-azure-key-vault, ms-azure-subscriptions, ms-backups]
  severity: medium
  question: Do crown-jewel Azure resources, such as production storage accounts, key vaults, Recovery Services vaults and Log Analytics workspaces, carry delete locks that only a small group can remove?
  why: >-
    A single command or a compromised automation account can delete a whole storage account,
    database server or log workspace. A delete lock forces a deliberate extra step, which stops
    accidents and slows an attacker down long enough to be noticed.
  yesLooksLike: >-
    Production storage accounts, databases, key vaults, Recovery Services and Backup vaults, Log
    Analytics workspaces and DNS zones have CanNotDelete (Delete) locks, applied by infrastructure as
    code or a custom Azure Policy definition, and only a small group (for example a custom
    lock-administrator role activated through PIM) can remove them.
  remediation: >-
    Add Delete locks to crown-jewel resources or their resource groups (but not to the resource groups
    Azure Backup creates for VM restore points, where a lock makes backups fail), create a custom role
    with only Microsoft.Authorization/locks permissions for the people who manage them and make it
    eligible through PIM, and keep Owner and User Access Administrator (which can also remove locks) to
    a minimum.
  effort: S
  licence: []
  sources: [ms-azure-locks]
  refs:
    - { framework: cis-azure, ref: "6.2" }
    - { framework: cis-azure, ref: "5.5" }
    - { framework: cis-azure, ref: "9.3.9" }
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: AM-3 }
