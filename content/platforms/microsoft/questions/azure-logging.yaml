- id: MS-AZ-002
  module: azure
  domain: azure-logging
  appliesTo: [ms-azure-subscriptions, ms-azure-key-vault, ms-azure-data-stores, ms-azure-workloads]
  severity: high
  question: Is Microsoft Defender for Cloud enabled on every subscription, with Defender plans turned on for production workloads?
  why: >-
    Cloud misconfigurations such as open storage, exposed management ports and unpatched VMs are
    found by attackers within hours. Defender for Cloud measures posture against the Microsoft cloud
    security benchmark and its workload plans detect attacks on servers, storage, databases, Key Vault
    and the Azure control plane as they happen.
  yesLooksLike: >-
    Foundational CSPM is on for every subscription, and production subscriptions have the Defender
    plans that match what they run: Servers, Storage, Databases (SQL, open-source relational and
    Cosmos DB), Key Vault, Resource Manager, Containers and App Service, with their alerts flowing to
    Defender XDR or Microsoft Sentinel.
  remediation: >-
    Enable Defender for Cloud on all subscriptions through Azure Policy at management group scope,
    turn on the relevant Defender plans and their components (such as vulnerability assessment and
    agentless scanning for machines) for production, and connect Defender for Cloud alerts to Defender
    XDR or Sentinel.
  effort: M
  licence: [defender-for-cloud]
  sources: [ms-mdc, ms-defender-servers, ms-mdc-containers, ms-mcsb]
