- id: MS-AZ-012
  module: azure
  domain: azure-data
  appliesTo: [ms-azure-data-stores]
  severity: critical
  question: Is anonymous blob access disallowed on every storage account?
  why: >-
    A container set to anonymous access lets anyone on the internet who finds or guesses its address
    list and download every file in it, with no sign-in and nothing in your identity logs. Public
    containers are among the most common causes of cloud data breaches.
  yesLooksLike: >-
    Every storage account has "Allow Blob anonymous access" set to Disabled, so no container can be
    made public. Content meant for the public is served through a CDN or web app instead.
  remediation: >-
    Use the Azure Resource Graph query or the Defender for Cloud recommendation to find storage
    accounts that allow anonymous access, check which containers are actually public, move any
    genuinely public content behind a CDN or web app, set "Allow Blob anonymous access" to Disabled,
    and assign the built-in policy that denies anonymous blob access at management group scope.
  effort: S
  licence: []
  sources: [ms-storage-anon]
  refs:
    - { framework: cis-azure, ref: "9.3.8" }
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: nist-csf-2, ref: PR.DS-01 }
    - { framework: mcsb, ref: NS-2 }
    - { framework: ms-zero-trust, ref: Data III }
    - { framework: idcf, ref: "DSL-2 Authorised person" }

- id: MS-AZ-013
  module: azure
  domain: azure-data
  appliesTo: [ms-azure-data-stores]
  severity: high
  question: Is Shared Key (account key) authorisation disallowed on storage accounts holding sensitive data, so every request is authorised through Microsoft Entra ID?
  why: >-
    A storage account key gives full control of every container, file share, queue and table in the
    account, and SAS tokens signed with it work for anyone who holds the link. Keys bypass MFA and
    Conditional Access, and requests made with them aren't tied to a person in the logs.
  yesLooksLike: >-
    "Allow storage account key access" is Disabled on every storage account holding sensitive data,
    and applications, people and partners use Microsoft Entra identities with data-plane roles or user
    delegation SAS.
  remediation: >-
    Use Azure Monitor metrics or storage logs to find clients still using Shared Key or account SAS,
    move them to managed identities and Storage Blob Data or Storage File Data roles, replace account
    SAS with user delegation SAS, then set "Allow storage account key access" to Disabled and enforce
    it with Azure Policy. Turn on "Default to Microsoft Entra authorization in the Azure portal" so the
    portal stops using keys, and rotate keys regularly on any account that still needs them while you
    move.
  effort: M
  licence: []
  sources: [ms-storage-shared-key, ms-storage-portal-entra-auth]
  refs:
    - { framework: cis-azure, ref: "9.3.1.3" }
    - { framework: nist-csf-2, ref: PR.AA-01 }
    - { framework: mcsb, ref: IM-1 }
    - { framework: mcsb, ref: IM-8 }
    - { framework: ms-zero-trust, ref: Data III }
    - { framework: ism, ref: ISM-2141 }
    - { framework: idcf, ref: "DSL-2 Authorised person" }

- id: MS-AZ-014
  module: azure
  domain: azure-data
  appliesTo: [ms-azure-data-stores, ms-azure-workloads]
  severity: low
  question: Do Azure storage accounts, databases and web apps refuse unencrypted connections, with TLS 1.2 or later as the minimum wherever you can set it?
  why: >-
    Data sent over plain HTTP or an old TLS version can be read or altered on the way, including the
    credentials and tokens in each request. Older resources often still carry permissive settings from
    before secure defaults existed.
  yesLooksLike: >-
    "Secure transfer required" is on for every storage account; App Service and Functions apps have
    HTTPS Only on; PostgreSQL and MySQL flexible servers require encrypted connections; and wherever a
    minimum TLS version can be set (storage, Azure SQL, Cosmos DB, MySQL, App Service), it is 1.2 or
    later.
  remediation: >-
    Use Defender for Cloud recommendations or Azure Policy results to find resources that allow
    HTTP or TLS below 1.2, turn on "Secure transfer required", require secure transport on PostgreSQL
    and MySQL, set HTTPS Only and the minimum TLS version in each app's configuration, set the minimum
    TLS version to 1.2 on SQL servers, and assign the matching policies with the Deny effect.
  effort: S
  licence: []
  sources: [ms-storage-secure-transfer, ms-storage-min-tls, ms-azure-sql-connectivity, ms-app-service-configure]
  refs:
    - { framework: cis-azure, ref: "9.3.4" }
    - { framework: cis-azure, ref: "9.3.6" }
    - { framework: nist-csf-2, ref: PR.DS-02 }
    - { framework: mcsb, ref: DP-3 }
    - { framework: ism, ref: ISM-1139 }
    - { framework: ism, ref: ISM-1781 }
    - { framework: idcf, ref: Movement }

- id: MS-AZ-015
  module: azure
  domain: azure-data
  appliesTo: [ms-azure-data-stores]
  severity: high
  question: Can deleted or overwritten data in crown-jewel storage accounts be recovered, with blob soft delete, container soft delete, versioning and file share soft delete turned on?
  why: >-
    Ransomware and malicious insiders delete or overwrite storage data directly through the storage
    APIs. Without soft delete and versioning, anything removed or encrypted that way is gone the moment
    it happens.
  yesLooksLike: >-
    Storage accounts holding crown-jewel data have blob soft delete, container soft delete and blob
    versioning on, with retention long enough to notice an incident, and Azure Files shares have soft
    delete on.
  remediation: >-
    In each storage account's Data protection settings, turn on soft delete for blobs and containers,
    versioning for blobs (with a lifecycle rule to control cost) and soft delete for file shares, and
    set a retention period that suits your detection time (for example 14 days or more). For the most
    critical data, add a time-based immutability policy or Azure Backup vaulted backup.
  effort: S
  licence: []
  sources: [ms-storage-data-protection, ms-files-soft-delete, ms-storage-immutable]
  refs:
    - { framework: cis-azure, ref: "9.1.1" }
    - { framework: cis-azure, ref: "9.2.1" }
    - { framework: cis-azure, ref: "9.2.2" }
    - { framework: cis-azure, ref: "9.2.3" }
    - { framework: nist-csf-2, ref: PR.DS-11 }
    - { framework: mcsb, ref: BR-1 }
    - { framework: mcsb, ref: BR-2 }

- id: MS-AZ-016
  module: azure
  domain: azure-data
  appliesTo: [ms-azure-key-vault]
  severity: medium
  question: Do keys and secrets in production key vaults have expiry dates and a rotation schedule, with alerts before they expire?
  why: >-
    A secret that never changes stays useful to whoever copied it, for as long as they like. Expiry
    dates and rotation shrink that window, and near-expiry alerts stop rotation turning into an outage.
  yesLooksLike: >-
    Keys and secrets in production vaults carry expiration dates; keys have a rotation policy (at most
    every two years, sooner for high-value keys); secrets such as passwords and API keys are rotated on
    a schedule, automatically where the service supports it; and near-expiry events reach an owner.
  remediation: >-
    Set a key rotation policy with automatic rotation and an expiry time on each key, add expiration
    dates to secrets, automate secret rotation with Event Grid and Azure Functions or the service's own
    rotation, subscribe owners to near-expiry events, and assign the Key Vault policies that audit keys
    and secrets without an expiration date.
  effort: M
  licence: []
  sources: [ms-kv-key-rotation, ms-kv-secure]
  refs:
    - { framework: cis-azure, ref: "8.3.1" }
    - { framework: cis-azure, ref: "8.3.2" }
    - { framework: cis-azure, ref: "8.3.3" }
    - { framework: cis-azure, ref: "8.3.4" }
    - { framework: cis-azure, ref: "8.3.9" }
    - { framework: nist-csf-2, ref: PR.AA-01 }
    - { framework: mcsb, ref: DP-6 }

- id: MS-AZ-017
  module: azure
  domain: azure-data
  appliesTo: [ms-azure-data-stores]
  severity: high
  question: Do Azure SQL, Cosmos DB and other Azure databases accept only Microsoft Entra authentication, with SQL logins, local passwords and account keys disabled?
  why: >-
    SQL logins, local database passwords and Cosmos DB account keys are shared secrets that skip MFA
    and Conditional Access and often sit in connection strings. Anyone who finds one can connect as a
    database administrator, and the logs won't show who it was.
  yesLooksLike: >-
    Azure SQL servers and managed instances have Microsoft Entra-only authentication turned on;
    PostgreSQL flexible servers allow Microsoft Entra authentication only and MySQL flexible servers
    are set to "Microsoft Entra authentication only"; Cosmos DB for NoSQL accounts have key-based
    authentication disabled (disableLocalAuth) and use data-plane RBAC; and an Entra group, not a
    person, is the database administrator. Cosmos DB APIs that don't support Entra authentication count
    as Partial.
  remediation: >-
    Set a Microsoft Entra group as administrator on each server, move applications to managed
    identities and people to Entra accounts, then turn on Microsoft Entra-only authentication for
    Azure SQL, switch PostgreSQL and MySQL to Microsoft Entra authentication only, disable key-based
    authentication on Cosmos DB, and enforce these with Azure Policy.
  effort: L
  licence: []
  sources: [ms-azure-sql-entra-only, ms-cosmos-entra-rbac, ms-postgres-entra, ms-mysql-entra]
  refs:
    - { framework: nist-csf-2, ref: PR.AA-01 }
    - { framework: nist-csf-2, ref: PR.AA-03 }
    - { framework: mcsb, ref: IM-1 }
    - { framework: mcsb, ref: IM-8 }
    - { framework: ms-zero-trust, ref: Data III }
