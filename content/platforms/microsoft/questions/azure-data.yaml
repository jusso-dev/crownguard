- id: MS-AZ-003
  module: azure
  domain: azure-data
  appliesTo: [ms-azure-key-vault]
  severity: high
  question: Do production key vaults have purge protection turned on, so deleted keys and secrets can't be permanently destroyed before the retention period ends?
  why: >-
    Without purge protection, an attacker or a mistake can delete a vault and purge it straight away,
    permanently destroying the keys that encrypt your data and the secrets your applications need to
    run.
  yesLooksLike: >-
    Every production key vault and managed HSM has soft delete and purge protection on, with a
    retention period long enough to notice a deletion and recover (90 days by default).
  remediation: >-
    Turn on purge protection for each production vault (it can't be turned off again, so deleted
    vault names stay reserved until the retention period ends), and assign the built-in Azure Policy
    definition that audits key vaults without deletion protection at management group scope.
  effort: S
  licence: []
  sources: [ms-kv-soft-delete, ms-kv-secure]
  refs:
    - { framework: cis-azure, ref: "8.3.5" }
    - { framework: nist-csf-2, ref: PR.DS-01 }
    - { framework: nist-csf-2, ref: PR.DS-11 }
    - { framework: mcsb, ref: DP-8 }

- id: MS-AZ-005
  module: azure
  domain: azure-data
  appliesTo: [ms-azure-data-stores, ms-azure-workloads]
  severity: high
  question: Are Azure Backup vaults protecting crown-jewel workloads set to locked immutability with always-on soft delete, so not even backup administrators can delete recovery points early?
  why: >-
    Attackers with subscription access disable backups and delete recovery points before encrypting VMs
    and databases. Locked immutability stops any one compromised account, even a backup administrator,
    from destroying your recovery path.
  yesLooksLike: >-
    Production Recovery Services and Backup vaults have immutability enabled and locked and enhanced
    soft delete set to always-on, so no account can delete recovery points or shorten their retention
    before they expire.
  remediation: >-
    Enable and lock vault immutability and turn on always-on soft delete. Also deploy Resource Guard in
    a separate subscription or tenant with its own administrators, link it to vaults for multi-user
    authorisation, and configure backup alerts.
  effort: M
  licence: []
  sources: [ms-azure-backup-immutable, ms-azure-backup-mua]
  refs:
    - { framework: nist-csf-2, ref: PR.DS-11 }
    - { framework: mcsb, ref: BR-2 }
    - { framework: mcsb, ref: BR-3 }
    - { framework: ism, ref: ISM-1708 }
    - { framework: ism, ref: ISM-2151 }
  e8:
    - { strategy: regular-backups, level: 3 }

- id: MS-AZ-006
  module: azure
  domain: azure-data
  appliesTo: [ms-azure-data-stores, ms-azure-key-vault, ms-azure-workloads, ms-azure-subscriptions]
  severity: high
  question: Are storage accounts, databases, key vaults and other PaaS data services closed to public network access, reachable only through private endpoints or allow-listed networks?
  why: >-
    A database, storage account or key vault that accepts connections from the whole internet is only
    one leaked key, weak password or unpatched flaw away from a breach, and attackers scan Azure
    address ranges for exactly these endpoints.
  yesLooksLike: >-
    Storage accounts, Azure SQL, Cosmos DB, PostgreSQL and MySQL servers, key vaults, Azure AI Search
    services and Foundry resources holding sensitive data have public network access disabled and use
    private endpoints, or allow only named virtual networks and IP addresses with a default action of
    Deny; no SQL firewall rule allows 0.0.0.0 to 255.255.255.255; and "Allow Azure services and
    resources to access this server" is off unless documented.
  remediation: >-
    Create private endpoints for production data services and disable public network access, or set
    the networking default action to Deny with only required virtual networks and IP ranges allowed;
    remove broad SQL firewall rules; and assign the built-in Azure Policy definitions that audit or
    deny public network access at management group scope.
  effort: M
  licence: []
  sources: [ms-storage-network, ms-private-endpoint, ms-azure-sql-firewall, ms-kv-secure, ms-foundry-vnets]
  refs:
