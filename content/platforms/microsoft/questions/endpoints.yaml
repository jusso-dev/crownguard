- id: MS-END-036
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints, ms-hybrid-identity, ms-privileged-roles]
  severity: high
  question: Are memory integrity, LSA protection, Credential Guard and Remote Credential Guard turned on for Windows devices and servers?
  why: >-
    Credential theft tools read passwords, hashes and Kerberos tickets from memory to move from one
    machine to the next. These Windows features isolate or protect those secrets, so one compromised
    device doesn't give up the credentials of every admin who has signed in to it.
  yesLooksLike: >-
    Intune settings catalog or Group Policy settings turn on memory integrity, run LSA as a protected
    process with UEFI lock, enable Credential Guard and require Remote Credential Guard for Remote
    Desktop connections on every Windows device and server whose hardware supports them, and reports
    show the features running.
  remediation: >-
    Check hardware and driver readiness, then deploy settings catalog policies for memory integrity, LSA
    protection and Credential Guard (Credential Guard is on by default from Windows 11 22H2 on supported
    hardware), configure Remote Credential Guard on both the connecting devices and the remote hosts,
    and use ASD's Windows hardening guidance for the matching Group Policy settings on servers.
  effort: M
  licence: [intune]
  sources: [ms-e8-restrict-admin, ms-lsa-protection, ms-memory-integrity, asd-windows-11-hardening]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: PV-3 }
    - { framework: mcsb, ref: IM-8 }
  e8:
    - { strategy: restrict-admin-privileges, level: 3 }
