- id: MS-END-001
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Are all company devices enrolled in Intune with compliance policies, and are devices with no compliance policy marked not compliant?
  why: >-
    Compliance status is what lets Conditional Access refuse sign-ins from devices that are
    unencrypted, out of date or infected. Devices outside management are invisible and unprotected.
  yesLooksLike: >-
    All corporate Windows, macOS, iOS and Android devices are enrolled; compliance policies require
    encryption, a minimum OS version, a passcode and an acceptable Defender risk level; the tenant
    marks devices with no compliance policy as not compliant; and non-compliance triggers
    notification and loss of access.
  remediation: >-
    Enrol devices through Windows Autopilot and Apple and Android enrolment, create compliance
    policies per platform, set "Mark devices with no compliance policy assigned as" to Not compliant,
    configure actions for non-compliance, and pair this with a Conditional Access compliant-device
    policy.
  effort: L
  licence: [intune]
  sources: [ms-intune-compliance, ms-zt-endpoints]
  refs:
    - { framework: cis-m365, ref: "4.1" }
    - { framework: cis-m365, ref: "4.2" }
    - { framework: nist-csf-2, ref: ID.AM-01 }
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: AM-1 }
    - { framework: ms-zero-trust, ref: Endpoints 1 }
    - { framework: idcf, ref: "DSL-2 Physical" }
    - { framework: idcf, ref: "DSL-3 Physical" }
    - { framework: idcf, ref: "Whole system" }

- id: MS-END-002
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Are Microsoft Office macros disabled for users without a business need, blocked in files from the internet, and locked so users cannot change these settings?
  why: >-
    Malicious macros in emailed or downloaded documents are still a common way to get code running
    on a user's computer, leading to ransomware or token theft.
  yesLooksLike: >-
    An Intune policy disables macros for all users except an approved group, keeps the block on
    macros in files from the internet, enables macro antivirus scanning, and users cannot override
    these settings.
  remediation: >-
    Deploy Microsoft 365 Apps macro settings with the Intune settings catalog or Cloud Policy:
    disable VBA macros without notification for most users, block macros from running in Office
    files from the internet, and force runtime antivirus scanning. Scope an exception group for
    documented business needs.
  effort: M
  licence: [intune, m365-apps-enterprise]
  sources: [ms-macros-internet, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: PV-3 }
  e8:
    - { strategy: office-macros, level: 1 }

- id: MS-END-003
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Are attack surface reduction rules in block mode on Windows devices to stop Office apps, including Outlook, creating child processes, creating executable content or injecting code into other processes, and to stop PDF software creating child processes?
  why: >-
    Even approved documents can be weaponised. ASR rules stop the behaviours attackers rely on after a
    user opens a malicious file, such as Word launching PowerShell, Office writing an executable to disk
    or a PDF starting another program.
  yesLooksLike: >-
    An Intune endpoint security policy sets "Block all Office applications from creating child
    processes", "Block Office communication application from creating child processes", "Block Office
    applications from creating executable content", "Block Office applications from injecting code into
    other processes" and, where Adobe Reader is used, "Block Adobe Reader from creating child processes"
    to Block on all Windows devices. Any other PDF application is stopped from launching child processes
    by equivalent controls, or Edge is the only PDF viewer. Exclusions are minimal and reviewed, and ASR
    events are visible in the Defender portal.
  remediation: >-
    Deploy the rules in audit mode through Intune endpoint security, review the events in the Defender
    portal for a few weeks, add narrow exclusions, then switch them to Block. Make Edge the default PDF
    viewer, or use application control to stop other PDF software launching programs. Also turn on
    Microsoft's other standard protection rules, such as "Block credential stealing from the Windows
    local security authority subsystem" and "Block executable content from email client and webmail".
  effort: M
  licence: [intune, defender-endpoint-p1]
  sources: [ms-asr-rules, ms-intune-asr, ms-e8-app-hardening, asd-office-hardening, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: ES-2 }
  e8:
    - { strategy: user-application-hardening, level: 2 }

- id: MS-END-004
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Is application control enforced on all workstations, at least in user profile and temporary folders, so only approved executables, software libraries, scripts, installers, compiled HTML, HTML applications and control panel applets can run there?
  why: >-
    Ransomware, remote access tools and infostealers usually run from a user's Downloads or Temp
    folder. Application control stops unapproved programs running even when a user is tricked into
    launching them.
  yesLooksLike: >-
    App Control for Business or AppLocker policies, deployed by Intune, Group Policy or Configuration
    Manager, are enforced on every workstation and cover at least user profile and temporary folders.
    Rules allow files only by publisher, hash, administrator-protected path or the Intune managed
    installer, never by reputation (Intune's "Trust apps with a good reputation" option is off), and
    cover executables, DLLs, scripts, installers, .chm and .hta files and control panel applets.
    AppLocker has no rule collection for .chm and .hta files, so with AppLocker mshta.exe and hh.exe are
    blocked for standard users.
  remediation: >-
    Start with an App Control for Business policy in audit mode (Microsoft notes AppLocker can meet this
    level), using Intune as a managed installer so IT-deployed apps are trusted and leaving "Trust apps
    with a good reputation" off. Review the audit events in Defender for Endpoint, then enforce.
    Microsoft's recommended block rules and vulnerable driver blocklist are the next steps.
  effort: L
  licence: [intune]
  sources: [ms-app-control, ms-e8-app-control, ms-intune-app-control, asd-implementing-application-control, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-05 }
    - { framework: mcsb, ref: AM-5 }
  e8:
    - { strategy: application-control, level: 1 }

- id: MS-END-005
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Are operating system updates applied to workstations within one month of release?
  why: >-
    Attackers weaponise published vulnerabilities within days. Devices that miss monthly updates
    remain open to exploits that are already in commodity attack kits.
  yesLooksLike: >-
    Windows Autopatch or Intune update rings with deadlines install quality updates within one month,
    macOS, iOS and Android updates are enforced through Intune, unsupported operating systems are
    replaced, and update status is reported.
  remediation: >-
    Enrol devices in Windows Autopatch or configure Intune update rings with deferral and deadline
    settings that complete within one month, use expedited quality updates for critical exploited
    vulnerabilities, enforce OS updates on other platforms, and add a minimum OS version to
    compliance policies.
  effort: M
  licence: [intune]
  sources: [ms-intune-windows-updates, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: ID.RA-01 }
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: mcsb, ref: PV-6 }
  e8:
    - { strategy: patch-operating-systems, level: 1 }

- id: MS-END-006
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Are updates for office productivity suites (such as Microsoft 365 Apps), web browsers and their extensions, email clients, PDF software and security products applied within two weeks of release?
  why: >-
    Office, browsers and PDF readers process untrusted content from email and the web every day,
    which makes them the most targeted applications on a workstation.
  yesLooksLike: >-
    Microsoft 365 Apps use Current Channel or Monthly Enterprise Channel with updates enforced and no
    devices held back on Semi-Annual Enterprise Channel version 2508 or older; Edge and other browsers
    and their extensions, email clients, PDF readers and security products update automatically or
    through Intune; reports show devices are within two weeks of the latest release; and versions their
    vendors no longer support are removed.
  remediation: >-
    Set the Microsoft 365 Apps update channel and deadline through Intune or Cloud Update, and move
    devices still on Semi-Annual Enterprise Channel to Monthly Enterprise Channel (Microsoft merged the
    two from version 2606 in July 2026, and version 2508 was supported only until 8 September 2026).
    Enforce browser auto-update policies, deploy PDF software through Intune with automatic updates, and
    remove unsupported Office versions and browser extensions.
  effort: M
  licence: [intune]
  sources: [ms-m365-apps-channels, ms-m365-apps-channel-unification, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: mcsb, ref: PV-6 }
  e8:
    - { strategy: patch-applications, level: 1 }

- id: MS-END-007
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints, ms-hybrid-identity]
  severity: high
  question: Does every Windows and macOS device and server run endpoint detection and response, with tamper protection on?
  why: >-
    Antivirus alone misses hands-on-keyboard attackers. EDR records what happened, lets responders
    isolate a device in seconds and, with automatic attack disruption, can contain ransomware before
    it spreads.
  yesLooksLike: >-
    All devices and servers are onboarded to Defender for Endpoint Plan 2 or Defender for Business
    (or an equivalent EDR), tamper protection is enforced tenant-wide, EDR in block mode is on, and
    automated investigation and response is set to remediate.
  remediation: >-
    Onboard devices to Defender through Intune, turn on tamper protection and EDR in block mode,
    set automation level to full remediation, and confirm every device reports as onboarded and
    healthy in the device inventory.
  effort: M
  licence: [defender-endpoint-p2]
  sources: [ms-edr-block-mode, ms-tamper-protection, ms-defender-business]
  refs:
    - { framework: nist-csf-2, ref: DE.CM-09 }
    - { framework: mcsb, ref: ES-1 }
    - { framework: ms-zero-trust, ref: Endpoints 4 }

- id: MS-END-008
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Do staff work without local administrator rights on their everyday accounts?
  why: >-
    Local admin rights let malware switch off protections and dump credentials, and a shared local
    administrator password lets an attacker move from one compromised laptop to every other.
  yesLooksLike: >-
    Users are not local administrators (elevation is handled by IT or Endpoint Privilege Management),
    Global Administrators are not added as local admins on Entra join, and users who join devices to
    Entra aren't made local administrators.
  remediation: >-
    In Entra device settings stop registering users becoming local administrators and remove Global
    Administrator from the local Administrators group on Entra join, use Intune account protection to
    control membership of the local Administrators group, and handle tasks that need admin rights
    through Endpoint Privilege Management or IT-run elevation.
  effort: M
  licence: [intune]
  sources: [ms-entra-device-local-admin, ms-e8-restrict-admin]
  refs:
    - { framework: cis-m365, ref: "5.1.4.3" }
    - { framework: cis-m365, ref: "5.1.4.4" }
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: mcsb, ref: PA-7 }
  e8:
    - { strategy: restrict-admin-privileges, level: 1 }

- id: MS-END-009
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints, ms-privileged-roles]
  severity: high
  question: Do high-impact Intune actions, such as wiping devices or deploying scripts and apps, require approval from a second administrator?
  why: >-
    Intune can run a script on, or wipe, every enrolled device at once. A single compromised Intune
    or Global Administrator account can therefore become a fleet-wide destruction or ransomware
    event.
  yesLooksLike: >-
    Intune Multi Admin Approval access policies protect device wipe, retire and delete, scripts and
    app deployments; approvers are a small separate group; scoped Intune RBAC limits who can make
    changes; and Intune role holders use PIM and phishing-resistant MFA.
  remediation: >-
    In the Intune admin centre under Tenant administration, create Multi Admin Approval access
    policies for device actions, scripts and apps with a dedicated approver group, reduce Intune
    Administrator assignments using scoped RBAC roles, and alert on high-impact Intune actions.
  effort: S
  licence: [intune]
  sources: [ms-intune-maa]
  refs:
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: mcsb, ref: PA-1 }
    - { framework: idcf, ref: "DSL-4 Authorised person" }

- id: MS-END-010
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Are unmanaged devices discovered automatically, and are all workstations and servers scanned for missing updates by a vulnerability scanner at least weekly, and internet-facing servers daily?
  why: >-
    You can only patch what you know about. Without automated discovery and vulnerability scanning,
    unmanaged devices and forgotten servers stay exposed long after fixes ship, and nobody notices when
    an update fails to install.
  yesLooksLike: >-
    Device discovery runs continuously (or at least fortnightly) and finds unmanaged devices on your
    networks so they can be onboarded, and Microsoft Defender Vulnerability Management (or another
    scanner with a current vulnerability database) assesses every onboarded workstation and server for
    missing operating system, browser and extension, Office, email client, PDF reader and security
    product updates, with internet-facing servers assessed at least daily and results reviewed at least
    weekly.
  remediation: >-
    Onboard all devices and servers to Defender for Endpoint and keep standard device discovery on,
    onboard the unmanaged devices it finds, and review the Defender Vulnerability Management weaknesses,
    software inventory and security recommendations pages (or your scanner's reports) at least weekly to
    drive patching and the removal of unsupported software.
  effort: M
  licence: [defender-endpoint-p2]
  sources: [ms-mdvm, ms-device-discovery, ms-e8-patch-applications, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: ID.AM-01 }
    - { framework: nist-csf-2, ref: ID.RA-01 }
    - { framework: mcsb, ref: AM-1 }
    - { framework: mcsb, ref: PV-5 }
  e8:
    - { strategy: patch-applications, level: 1 }
    - { strategy: patch-operating-systems, level: 1 }

- id: MS-END-011
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Are operating system patches for internet-facing servers applied within two weeks of release (48 hours when critical or a working exploit exists), and for other servers within one month?
  why: >-
    Internet-facing servers such as AD FS, Web Application Proxy and Exchange hybrid servers are
    attacked within days of a patch being published, and internal servers such as domain controllers and
    Entra Connect are the next stop. Slow server patching turns published flaws into an easy way in.
  yesLooksLike: >-
    Azure Update Manager, Configuration Manager, Windows Server Update Services or another patching tool
    applies operating system updates, or the vendor's mitigation, to internet-facing servers within two
    weeks of release, or within 48 hours when the vendor rates a vulnerability critical or a working
    exploit exists, and to all other servers within one month; patch status is reported, and servers on
    unsupported operating systems are replaced. If you run no servers, answer N/A and say so.
  remediation: >-
    Connect on-premises servers to Azure Arc and schedule updates for them and Azure virtual machines
    with Azure Update Manager maintenance configurations (or use WSUS or Configuration Manager), give
    internet-facing servers a fast-track schedule for critical and exploited vulnerabilities, and plan
    upgrades for servers running unsupported versions of Windows Server or Linux.
  effort: M
  licence: []
  sources: [ms-azure-update-manager, ms-e8-patch-os, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: nist-csf-2, ref: ID.RA-01 }
    - { framework: mcsb, ref: PV-6 }
  e8:
    - { strategy: patch-operating-systems, level: 1 }

- id: MS-END-012
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Are applications other than office suites, web browsers and their extensions, email clients, PDF software and security products scanned for missing updates by a vulnerability scanner at least fortnightly, with updates or vendor mitigations applied within one month of release?
  why: >-
    Attackers also exploit everyday software such as archive tools, remote access clients, Java and .NET
    runtimes and line-of-business apps. Without a scanner nobody notices the outdated copies, and any
    one of them can be the foothold that leads to stolen sessions and data.
  yesLooksLike: >-
    Defender Vulnerability Management continuously assesses every workstation and server (or another
    vulnerability scanner checks them at least fortnightly), and updates or vendor mitigations for all
    other applications are applied within one month of release, with reports showing which devices are
    behind.
  remediation: >-
    Onboard all devices and servers to Defender for Endpoint so Defender Vulnerability Management tracks
    their software inventory and missing updates, and turn on the Microsoft Intune connection under
    Settings > Endpoints > General > Advanced features in the Defender portal so remediation requests
    become Intune security tasks. Keep apps current with Microsoft Store apps in Intune, Win32 app
    supersedence or Intune Enterprise App Management (included in Microsoft 365 E5 from August 2026,
    otherwise an Intune add-on), and set a one-month deadline for everything that doesn't update itself.
  effort: M
  licence: [intune, defender-endpoint-p2]
  sources: [ms-e8-patch-applications, ms-dvm-capabilities, ms-m365-pricing-packaging-2026, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: ID.RA-01 }
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: mcsb, ref: PV-5 }
    - { framework: mcsb, ref: PV-6 }
  e8:
    - { strategy: patch-applications, level: 2 }

- id: MS-END-013
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Are updates for office productivity suites (such as Microsoft 365 Apps), web browsers and their extensions, email clients, PDF software and security products applied within 48 hours when the vendor rates a vulnerability critical or a working exploit exists, and within two weeks otherwise?
  why: >-
    Browser and Office flaws are often exploited within hours of a fix being published, through a link
    or an attachment. Every day a device keeps the vulnerable version is a day an attacker can take it
    over with a single click.
  yesLooksLike: >-
    An emergency patch process starts whenever a vendor rates an update critical or a working exploit is
    known (a vendor advisory, CISA's Known Exploited Vulnerabilities catalogue or a public proof of
    concept), and reports show every device updated, or the vendor's mitigation applied, within 48
    hours: Microsoft 365 Apps get the fix through the cloud update Current profile with a short deadline
    or an immediate update pushed to devices, Edge and other browsers update automatically with a
    required relaunch, and PDF software and security products update automatically. Other updates land
    within two weeks.
  remediation: >-
    For Microsoft 365 Apps, use the cloud update Current profile (it reaches devices within one to two
    days) with a deadline of 0 days, or trigger an immediate update on devices with a script or
    Configuration Manager, for critical or exploited fixes. The Monthly Enterprise profile rolls updates
    out over four to five days and Windows Autopatch gives users a seven-day deadline, so they only suit
    the two-week case. Keep Edge automatic updates on and set RelaunchNotification to Required with a
    RelaunchNotificationPeriod well under the seven-day default, deploy PDF software with automatic
    updates, and check Defender Vulnerability Management to confirm the fixed version is everywhere.
    Record who declares an emergency update and how fast each update ring must finish.
  effort: M
  licence: [intune]
  sources: [ms-e8-patch-applications, ms-m365-apps-cloud-update-deadlines, ms-autopatch-m365-apps, ms-edge-relaunch-notification, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: nist-csf-2, ref: ID.RA-06 }
    - { framework: mcsb, ref: PV-6 }
  e8:
    - { strategy: patch-applications, level: 3 }

- id: MS-END-014
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Are applications that their vendor no longer supports removed from workstations and servers?
  why: >-
    Software past its end of support never gets another security fix, so every new flaw in it stays open
    for good. Old runtimes, plug-ins and utilities left behind on a few devices are an easy way in.
  yesLooksLike: >-
    The end-of-support tags in Defender Vulnerability Management (or another software inventory) are
    reviewed regularly, and no workstation or server still runs an application or application version
    that its vendor no longer supports. Defender's end-of-support tags cover Windows software only, so
    macOS and Linux devices are checked with another inventory.
  remediation: >-
    Filter Defender Vulnerability Management recommendations and the software inventory by the
    end-of-support tags, uninstall what they find with Intune (change the app assignment to Uninstall or
    replace it through supersedence), block reinstallation with application control, and add
    end-of-support dates to your software approval process so replacements are planned before support
    ends.
  effort: M
  licence: [intune, defender-endpoint-p2]
  sources: [ms-e8-patch-applications, ms-dvm-end-of-support, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: nist-csf-2, ref: ID.AM-02 }
    - { framework: mcsb, ref: AM-3 }
  e8:
    - { strategy: patch-applications, level: 3 }

- id: MS-END-015
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Are operating system updates for workstations and servers that aren't internet-facing applied within 48 hours when the vendor rates a vulnerability critical or a working exploit exists, and within one month otherwise?
  why: >-
    Once a Windows or server flaw is under active attack, waiting for the normal monthly cycle leaves
    every device exposed. Internal servers such as domain controllers and Entra Connect are prime
    targets, because one compromised server can hand an attacker the identity plane.
  yesLooksLike: >-
    An emergency process applies critical and exploited operating system fixes, or the vendor's
    mitigation, within 48 hours on every workstation and internal server, for example with Intune
    expedite policies or Windows Autopatch for Windows devices and Azure Update Manager, Configuration
    Manager or WSUS deadlines (or hotpatching) for servers; reports confirm completion, and all other
    operating system updates install within one month.
  remediation: >-
    Create an expedite policy for the update in the Intune admin centre (Windows updates > Quality
    updates) with a short restart deadline, which overrides update ring deferrals, patch servers on
    demand with Azure Update Manager (connect on-premises servers through Azure Arc), Configuration
    Manager or hotpatch, and confirm completion in Autopatch, Intune and Defender Vulnerability
    Management reports. Record who declares an emergency update.
  effort: M
  licence: [intune]
  sources: [ms-e8-patch-os, ms-intune-quality-updates, ms-azure-update-manager, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: nist-csf-2, ref: ID.RA-06 }
    - { framework: mcsb, ref: PV-6 }
  e8:
    - { strategy: patch-operating-systems, level: 3 }

- id: MS-END-016
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Are missing driver and firmware updates on workstations and servers found by a scanner at least fortnightly and installed within one month of release, or within 48 hours when a vulnerability is critical or a working exploit exists?
  why: >-
    Attackers abuse vulnerable drivers and outdated firmware to switch off security tools and to hide
    below the operating system, where reinstalling Windows doesn't remove them. These fixes are easy to
    miss because they don't arrive with the monthly Windows update.
  yesLooksLike: >-
    Defender Vulnerability Management with hardware and firmware assessment, Intune driver update
    reports or the hardware vendor's tooling show missing driver and firmware updates at least
    fortnightly, driver update policies in Intune or Windows Autopatch approve recommended driver and
    firmware updates within one month, and fixes for critical or exploited vulnerabilities are approved
    and installed within 48 hours.
  remediation: >-
    Create Windows driver update policies in Intune, or manage drivers through Windows Autopatch, with
    automatic approval of recommended updates and a short delay, approve critical fixes as soon as they
    appear, and use the Defender Vulnerability Management hardware and firmware inventory to find
    devices with vulnerable BIOS and firmware. That inventory needs the Defender Vulnerability
    Management add-on (or Defender for Servers Plan 2 for servers). Use the hardware vendor's update
    tools for firmware that Windows Update doesn't deliver.
  effort: M
  licence: [intune, defender-endpoint-p2]
  sources: [ms-e8-patch-os, ms-intune-driver-updates, ms-dvm-firmware, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: nist-csf-2, ref: PR.PS-03 }
    - { framework: mcsb, ref: PV-5 }
    - { framework: mcsb, ref: PV-6 }
  e8:
    - { strategy: patch-operating-systems, level: 3 }

- id: MS-END-017
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Do all workstations and servers run the latest or the previous release of their operating system?
  why: >-
    Each new Windows release adds protections that older ones lack and resets the support clock. Devices
    that fall more than one release behind miss those defences and drift towards running an unsupported
    system.
  yesLooksLike: >-
    Windows 11 devices run the newest or previous feature update offered to them (for example 26H2 or
    25H2 as of October 2026; 26H1 ships only on new hardware), Windows LTSC devices run the latest or
    previous LTSC release, servers run the latest or previous Windows Server release or Linux
    distribution release, macOS, iOS and Android devices run one of their two newest major versions, and
    the minimum OS version in Intune compliance policies stops anything older from reaching company
    data.
  remediation: >-
    Use Intune feature update policies or Windows Autopatch to move devices to each new Windows 11
    feature update, raise the minimum OS version in compliance policies as releases arrive and enforce
    it with Conditional Access, retire remaining Windows 10 devices, and plan in-place upgrades or
    rebuilds for servers older than Windows Server 2022.
  effort: L
  licence: [intune]
