- id: MS-END-018
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Is application control enforced in every location on workstations, not only user profile and temporary folders, and on internet-facing servers?
  why: >-
    Rules that only cover a user's profile and temporary folders can be sidestepped by running malware
    from any other folder the user can write to. Internet-facing servers are attacked directly and need
    the same protection.
  yesLooksLike: >-
    App Control for Business policies (or an equivalent product) in enforce mode cover the whole of
    every workstation, allowing files by publisher, hash or administrator-protected path rules (a
    managed installer such as Intune is optional), and internet-facing servers such as AD FS, web and
    remote access servers run enforced App Control policies too, or fapolicyd on Linux. If you have no
    internet-facing servers, answer for workstations.
  remediation: >-
    Move from AppLocker path rules to App Control for Business. Build a base policy with the App Control
    Wizard (for example from the Allow Microsoft template) or Intune's built-in controls, add
    supplemental policies for line-of-business apps, run it in audit mode, then enforce it with Intune
    endpoint security App Control for Business policies. On Windows Server 2025 apply the OSConfig App
    Control policies; on older servers deploy policies with Group Policy or Configuration Manager, and
    use fapolicyd on Linux servers.
  effort: L
  licence: [intune]
  sources: [ms-e8-app-control, ms-intune-app-control, ms-app-control-windows-server, asd-implementing-application-control]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-05 }
    - { framework: mcsb, ref: AM-5 }
  e8:
    - { strategy: application-control, level: 2 }

- id: MS-END-019
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Are Microsoft's recommended application block rules enforced wherever application control runs?
  why: >-
    Attackers run their own code through trusted, Microsoft-signed tools such as mshta, msbuild and
    installutil, which most allow lists approve by default. Microsoft's recommended block rules close
    those bypasses so application control can't simply be walked around.
  yesLooksLike: >-
    The current version of Microsoft's recommended block rules is merged into, or deployed alongside,
    the enforced App Control for Business policies on workstations and servers (on Windows Server 2025,
    the OSConfig AppBlockList scenario, checked against the current recommended block rules), and the
    rules are refreshed when Microsoft updates the list.
  remediation: >-
    Take the block rules policy from Microsoft's "Applications that can bypass App Control" page, test
    it in audit mode, then deploy it as its own enforced policy or merge it into your base policy with
    Merge-CIPolicy and deliver it through an Intune App Control for Business policy (custom XML). On
    Windows Server 2025 apply the OSConfig AppBlockList scenario.
  effort: S
  licence: [intune]
  sources: [ms-app-control-block-rules, ms-e8-app-control, ms-app-control-windows-server, asd-implementing-application-control]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-05 }
    - { framework: mcsb, ref: AM-5 }
  e8:
    - { strategy: application-control, level: 2 }

- id: MS-END-020
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: low
  question: Are application control rules reviewed and revalidated at least once a year?
  why: >-
    Allow lists drift as apps are retired, vendors change certificates and temporary exceptions are
    forgotten. Rules nobody reviews slowly become a list of ways for malware to run.
  yesLooksLike: >-
    A named owner reviews every application control rule, supplemental policy, managed installer and
    exception at least once a year, removes what is no longer needed, and records the review.
  remediation: >-
    Schedule an annual review in your change process, and another after major changes. Keep policy XML
    under version control. App Control doesn't log the files it allows, so compare the signers and
    hashes in your rules with process creation events (DeviceProcessEvents in advanced hunting) or the
    software inventory to find rules nothing uses, test a trimmed policy in audit mode before removing
    rules, and retire stale supplemental policies.
  effort: S
  licence: []
  sources: [ms-e8-app-control, ms-app-control-events, asd-implementing-application-control]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-05 }
    - { framework: nist-csf-2, ref: ID.IM-03 }
    - { framework: mcsb, ref: AM-5 }
  e8:
    - { strategy: application-control, level: 2 }

- id: MS-END-021
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Is application control also enforced on servers that aren't internet-facing, such as domain controllers, file servers and Entra Connect servers?
  why: >-
    Once inside the network, attackers move to internal servers and run their tools there. Domain
    controllers and Entra Connect servers matter most, because controlling them means controlling
    identity for both the on-premises network and Microsoft 365.
  yesLooksLike: >-
    Every internal server runs enforced application control: App Control for Business policies on
    Windows servers (the OSConfig default policy on Windows Server 2025, or policies deployed by Group
    Policy or Configuration Manager on older versions) and an equivalent such as fapolicyd on Linux
    servers. If you run no servers, answer N/A and say so.
  remediation: >-
    Start with Tier 0 servers (domain controllers, AD FS, AD CS and Entra Connect). Build server
    policies from Microsoft's default Windows Server policy or the App Control Wizard, run them in audit
    mode, review the events with the Azure Monitor App Control workbook or advanced hunting, then
    enforce, and extend to the remaining internal servers.
  effort: L
  licence: []
  sources: [ms-app-control-windows-server, ms-e8-app-control, asd-implementing-application-control]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-05 }
    - { framework: mcsb, ref: AM-5 }
  e8:
    - { strategy: application-control, level: 3 }

- id: MS-END-022
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Does application control limit drivers to an approved set, with Microsoft's vulnerable driver blocklist enforced on workstations and servers?
  why: >-
    Ransomware gangs load signed but vulnerable drivers to switch off antivirus and EDR from the kernel.
    Allowing only approved drivers and blocking known-bad ones removes that shortcut.
  yesLooksLike: >-
    Enforced App Control for Business policies on workstations and servers allow only drivers from
    approved signers (for example Windows Hardware Quality Labs signed drivers from your hardware
    vendors), and Microsoft's vulnerable driver blocklist is enforced everywhere, through memory
    integrity or by deploying the latest blocklist as an App Control policy.
  remediation: >-
    Add kernel-mode signer rules for your approved driver publishers to the App Control base policy,
    turn on memory integrity (hypervisor-protected code integrity) through Intune, and deploy
    Microsoft's recommended driver block rules as an App Control policy after testing in audit mode. The
    attack surface reduction rule "Block abuse of exploited vulnerable signed drivers" adds a further
    layer where Defender is licensed.
  effort: M
  licence: [intune]
  sources: [ms-app-control-driver-block-rules, ms-e8-app-control, asd-implementing-application-control]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-05 }
    - { framework: mcsb, ref: AM-5 }
    - { framework: mcsb, ref: ES-2 }
  e8:
    - { strategy: application-control, level: 3 }

- id: MS-END-023
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Are Office macros blocked from making Win32 API calls on every Windows device?
  why: >-
    Malicious macros call Windows APIs directly to download malware and inject it into memory, without
    writing a file that antivirus could scan. Blocking those calls breaks the usual next step after
    someone enables a macro.
  yesLooksLike: >-
    An Intune endpoint security policy sets the attack surface reduction rule "Block Win32 API calls
    from Office macros" to Block on all Windows devices, exclusions are minimal and reviewed, and its
    events are visible in the Defender portal. If VBA macros are disabled for every user (Disable VBA
    for Office applications), answer N/A and say so.
  remediation: >-
    In the Intune admin centre go to Endpoint security > Attack surface reduction, add "Block Win32 API
    calls from Office macros" in audit mode, review the events in the Defender portal for a few weeks,
    then set it to Block for all Windows devices.
  effort: S
  licence: [intune, defender-endpoint-p1]
  sources: [ms-asr-rules, ms-intune-asr, ms-e8-macros, asd-restricting-office-macros]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: ES-2 }
  e8:
    - { strategy: office-macros, level: 2 }

- id: MS-END-024
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: For users who need macros, can only macros signed by a trusted publisher with a V3 signature, kept in a secured Trusted Location or run in a sandboxed environment execute, with no way to enable others from the Message Bar or Backstage View?
  why: >-
    Staff who are allowed to run macros are prime phishing targets: if they can enable content in any
    document, one malicious attachment runs. Limiting them to vetted, signed macros means an attacker
    would need your signing key or write access to a trusted location.
  yesLooksLike: >-
    Intune or Cloud Policy settings for the macro users group allow only the approved route. For trusted
    publishers: VBA Macro Notification Settings is "Disable all except digitally signed macros", "Only
    trust VBA macros that use V3 signatures" and "Disable all Trust Bar notifications for security
    issues" are enabled, trusted documents are off, the Backstage View enable command (command bar ID
    19092) is disabled, and the Internet Options Content page and Certificates snap-in are blocked so
    users can't trust new publishers. For Trusted Locations: only secured, policy-defined locations are
    allowed and macros elsewhere are disabled without notification. Macros that run in a sandbox instead
    are confined to it. If macros are disabled for all users (Disable VBA for Office applications),
    answer N/A.
  remediation: >-
    Create an "Allow macro execution - Trusted Publisher" group, assign it Microsoft's "Macros Enabled
    for Trusted Publishers" policy (or ASD's settings for trusted publishers or Trusted Locations)
    through Intune or Cloud Policy, including the custom disable command 19092 and the Content page and
    Certificates snap-in restrictions, deploy each publisher certificate to the Trusted Publishers store
    with its own Intune policy, re-sign existing macros with V3 signatures, and keep everyone else on
    the policy that disables VBA.
  effort: M
  licence: [intune, m365-apps-enterprise]
  sources: [ms-e8-macros, ms-vba-v3-signature, asd-restricting-office-macros]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: PV-3 }
  e8:
    - { strategy: office-macros, level: 3 }

- id: MS-END-025
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Is every macro checked for malicious code before it's signed or placed in a Trusted Location, with only the privileged staff who do those checks able to write to Trusted Locations?
  why: >-
    Signing or trusting a macro tells every computer to run it without question. If macros are signed
    without review, or anyone can drop files into a Trusted Location, an attacker can launder malicious
    code through your own approval process.
  yesLooksLike: >-
    A documented process has an assessor who is independent of the macro's author test each new or
    changed macro on an isolated, hardened device before it is signed or placed in a Trusted Location,
    the signing certificate is restricted to those assessors, and file permissions let only their
    dedicated privileged accounts add or change files in Trusted Locations. Office's default Trusted
    Locations in user profiles (such as the Templates, XLSTART and Startup folders) are removed or
    disabled. If Trusted Locations are turned off, the vetting process alone gives a Yes; if no macros
    are signed or placed in Trusted Locations, answer N/A.
  remediation: >-
    Define the macro approval workflow, test macros on a disconnected device with the ASD Office
    hardening policies applied (or with a macro scanning tool), sign approved macros with a V3
    signature, keep the code-signing certificate in a protected store, and give standard users and
    everyday admin accounts read-only access to Trusted Location shares. If you only use trusted
    publishers, disable Trusted Locations instead.
  effort: M
  licence: []
  sources: [ms-e8-macros, asd-restricting-office-macros, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: nist-csf-2, ref: PR.AA-05 }
    - { framework: mcsb, ref: PV-3 }
  e8:
    - { strategy: office-macros, level: 3 }

- id: MS-END-026
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: low
  question: Is the list of trusted publishers for Office macros revalidated at least once a year?
  why: >-
    Every certificate in the Trusted Publishers store can sign macros that run without a warning.
    Unused, expired or compromised publishers left in place are a quiet way back in.
  yesLooksLike: >-
    At least once a year an administrator confirms that every certificate in the Trusted Publishers
    store on macro users' devices, and the Intune policy that deploys it, is still needed, within its
    validity period and chains to a trusted root, removes any that aren't, and records the review. If no
    trusted publishers are used for macros, answer N/A.
  remediation: >-
    Deploy each trusted publisher through its own Intune policy so it's easy to see and remove, schedule
    an annual review, and delete certificates and policies that are no longer required.
  effort: S
  licence: []
  sources: [ms-e8-macros, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: PV-3 }
  e8:
    - { strategy: office-macros, level: 3 }

- id: MS-END-027
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Is Internet Explorer 11 disabled or removed on every Windows device?
  why: >-
    Microsoft retired the Internet Explorer 11 app in June 2022. Its legacy engine lacks modern browser
    protections and, on most Windows versions, no longer gets fixes, so any page it opens has an easier
    way onto the device.
  yesLooksLike: >-
    Windows 11 devices don't include the Internet Explorer 11 app, any remaining Windows 10 or Windows
    Server devices have "Disable Internet Explorer 11 as a standalone browser" enabled or the feature
    removed, and legacy sites that still need it open in Edge's IE mode from a managed Enterprise Mode
    Site List.
  remediation: >-
    Deploy "Disable Internet Explorer 11 as a standalone browser" through the Intune settings catalog
    (Administrative Templates > Windows Components > Internet Explorer), or remove the feature with a
    script, and set up IE mode with an Enterprise Mode Site List for the few legacy sites that need it.
  effort: S
  licence: [intune]
  sources: [ms-e8-app-hardening, ms-edge-disable-ie11, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-02 }
    - { framework: mcsb, ref: PV-3 }
  e8:
    - { strategy: user-application-hardening, level: 1 }

- id: MS-END-028
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Do web browsers block advertisements and Java content from the internet?
  why: >-
    Malicious adverts on legitimate websites and fake download ads deliver malware and infostealers to
    people who never clicked anything suspicious. Java in the browser has a long history of exploits.
  yesLooksLike: >-
    Internet ads are blocked for all users by an ad-blocking extension force-installed through browser
    policy, by web filtering or by a protective DNS service, not only by Edge's "Ads setting for sites
    with intrusive ads", and Java isn't installed or can't run content from the internet.
  remediation: >-
    Force-install an approved ad-blocking extension with the ExtensionInstallForcelist policy, or block
    advertising networks with your web filter or protective DNS, keep "Ads setting for sites with
    intrusive ads" on Block, and remove Java from workstations that don't need it.
  effort: S
  licence: [intune]
  sources: [ms-e8-app-hardening, ms-edge-intrusive-ads, ms-edge-extensions, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: PV-3 }
  e8:
    - { strategy: user-application-hardening, level: 1 }

- id: MS-END-029
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Are web browser security settings enforced by policy so users can't change them?
  why: >-
    If people can turn off SmartScreen, allow downloads and pop-ups from any site or install any
    extension, one convincing web page can undo every browser protection you set up.
  yesLooksLike: >-
    Edge security settings, and those of any other approved browser, are delivered through Intune as
    mandatory policies, such as the Microsoft Edge security baseline, that standard users can't
    override, and users can't install or run unmanaged browsers.
  remediation: >-
    Assign the Microsoft Edge security baseline or Edge settings catalog policies in Intune as mandatory
    rather than recommended settings, manage any other allowed browser with its own policies, keep users
    out of the local Administrators group, and block unapproved browsers with application control.
  effort: S
  licence: [intune]
  sources: [ms-e8-app-hardening, ms-intune-security-baselines, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: PV-3 }
  e8:
    - { strategy: user-application-hardening, level: 1 }

- id: MS-END-030
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Are Microsoft Edge and any other browser you allow hardened with the vendor's security baseline and ASD's hardening guidance, with the stricter setting applied where they conflict?
  why: >-
    Browsers are the main way untrusted content reaches a workstation. Their default settings favour
    convenience; the vendor baseline and ASD guidance switch on protections that stop drive-by
    downloads, malicious extensions and phishing pages.
  yesLooksLike: >-
    The current Microsoft Edge security baseline and ASD's Microsoft Edge hardening settings (the ACSC
    Microsoft Edge hardening policy) are both assigned through Intune to every device, wherever they
    conflict the more restrictive value applies, any other approved browser has equivalent policies from
    its vendor's and ASD's guidance, and exceptions are documented.
  remediation: >-
    In the Intune admin centre go to Endpoint security > Security baselines > Microsoft Edge Baseline
    and assign the latest version, import the ACSC Microsoft Edge Hardening Guidelines policy published
    with Microsoft's Essential Eight guidance, resolve conflicts in favour of the stricter setting, and
    apply equivalent policies to any other browser you allow.
  effort: M
  licence: [intune]
  sources: [ms-e8-app-hardening, ms-intune-security-baselines, asd-windows-11-hardening]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: PV-3 }
  e8:
    - { strategy: user-application-hardening, level: 2 }

- id: MS-END-031
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: high
  question: Are Microsoft 365 Apps hardened with Microsoft's security baseline and ASD's guidance, including blocking activation of OLE packages, with settings enforced by policy so users can't change them?
  why: >-
    Office documents remain a leading way to deliver malware, through embedded OLE objects, old file
    formats, external content and add-ins as well as macros. Locked settings stop a user, or a malicious
    document, from switching those protections back off.
  yesLooksLike: >-
    The Microsoft 365 Apps for enterprise security baseline and ASD's Office hardening settings (such as
    the ACSC Office Hardening policy) are assigned through Intune or Cloud Policy to every Office user
    as policies rather than preferences, OLE package activation is blocked in Word, Excel and
    PowerPoint, Protected View and file block settings are on, and wherever the two conflict the
    stricter value applies.
  remediation: >-
    Assign the Microsoft 365 Apps for Enterprise baseline from Endpoint security > Security baselines in
    the Intune admin centre, import the ACSC Office Hardening policy and the script that prevents OLE
    package activation from Microsoft's Essential Eight guidance (or set the PackagerPrompt values from
    ASD's guide), and bundle them with the Microsoft 365 Apps deployment in an Intune policy set so
    every Office user gets them.
  effort: M
  licence: [intune, m365-apps-enterprise]
  sources: [ms-e8-app-hardening, ms-intune-security-baselines, asd-office-hardening]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: PV-3 }
  e8:
    - { strategy: user-application-hardening, level: 2 }

- id: MS-END-032
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Is your PDF software hardened using ASD and vendor guidance, with its security settings enforced so users can't change them?
  why: >-
    PDF files arrive by email every day, and PDF readers have a long record of exploitable flaws and
    risky features such as embedded JavaScript and attachments. Hardened, locked settings limit what a
    malicious PDF can do.
  yesLooksLike: >-
    PDFs open in Microsoft Edge's built-in viewer under your hardened, enforced Edge policies, or Adobe
    Acrobat Reader or another PDF application runs with its vendor's recommended security settings (such
    as Protected Mode, Enhanced Security and JavaScript turned off) and any ASD recommendations,
    delivered by Intune through imported administrative templates or locked registry settings, and users
    can't change them.
  remediation: >-
    Make Microsoft Edge the default PDF viewer where it meets business needs and harden it with your
    Edge policies. Otherwise import the PDF application's administrative templates into Intune, enforce
    Protected Mode, Enhanced Security and the other recommended settings, lock them so users can't
    change them, turn off risky features such as JavaScript where you can, and remove unmanaged PDF
    tools.
  effort: M
  licence: [intune]
  sources: [ms-e8-app-hardening, ms-intune-admx-import, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: PV-3 }
  e8:
    - { strategy: user-application-hardening, level: 2 }

- id: MS-END-033
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Are .NET Framework 3.5 (including .NET 2.0 and 3.0) and Windows PowerShell 2.0 disabled or removed on all Windows devices?
  why: >-
    These legacy components predate modern protections. Attackers deliberately fall back to PowerShell
    2.0 to avoid script logging and antimalware scanning, and old .NET versions lack the security
    features of current ones.
  yesLooksLike: >-
    The .NET Framework 3.5 and Windows PowerShell 2.0 optional features are off or absent on every
    Windows device (Windows 11 24H2 and Windows Server 2025 no longer include PowerShell 2.0), and
    software that needed .NET Framework 3.5 has been upgraded or moved off these devices.
  remediation: >-
    Deploy Microsoft's UserApplicationHardening-RemoveFeatures.ps1 script, or your own script that
    disables the optional features, through Intune, check periodically that the features stay off,
    update or replace software that depends on .NET Framework 3.5, and keep devices on current Windows
    releases.
  effort: S
  licence: [intune]
  sources: [ms-e8-app-hardening, ms-windows-removed-features, asd-e8-maturity-model]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: mcsb, ref: PV-3 }
  e8:
    - { strategy: user-application-hardening, level: 3 }

- id: MS-END-034
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints]
  severity: medium
  question: Does PowerShell run in Constrained Language Mode on workstations and servers, apart from scripts your application control policy explicitly trusts?
  why: >-
    PowerShell's full language lets an attacker call any .NET, COM or Windows API straight from memory.
    Constrained Language Mode removes those abilities from interactive sessions and untrusted scripts
    while your approved, signed scripts keep working.
  yesLooksLike: >-
    Enforced App Control for Business policies with script enforcement (or AppLocker script rules) put
    interactive PowerShell and any script the policy doesn't allow into Constrained Language Mode on
    every workstation and server, and $ExecutionContext.SessionState.LanguageMode returns
    ConstrainedLanguage in a standard user's session.
  remediation: >-
    Keep script enforcement on in your enforced App Control for Business policies (don't set the
    "Disabled:Script Enforcement" option), sign the PowerShell scripts and modules you rely on and allow
    their signer in the policy, and test administrative tooling in audit mode before enforcing. Apply
    the same policies to servers through Group Policy, Configuration Manager or OSConfig on Windows
    Server 2025.
  effort: M
  licence: [intune]
  sources: [ms-app-control-script-enforcement, ms-powershell-language-modes, ms-e8-app-hardening]
  refs:
    - { framework: nist-csf-2, ref: PR.PS-01 }
    - { framework: nist-csf-2, ref: PR.PS-05 }
    - { framework: mcsb, ref: PV-3 }
  e8:
    - { strategy: user-application-hardening, level: 3 }

- id: MS-END-035
  module: core
  domain: endpoints
  appliesTo: [ms-managed-endpoints, ms-hybrid-identity, ms-privileged-roles]
  severity: high
  question: Does every Windows device and server have its own local administrator password that Windows LAPS rotates and backs up?
  why: >-
    When the built-in administrator account shares a password across machines, an attacker who extracts
    it from one compromised laptop can sign in to every other device and server that uses the same
    password.
  yesLooksLike: >-
    Windows LAPS is enabled in Entra ID, and an Intune account protection policy (or Windows LAPS Group
    Policy for domain-joined servers) manages the local administrator account on every Windows device
    and server, rotating a long random password that's backed up to Entra ID or Active Directory and
    readable only by a small group.
  remediation: >-
    Enable Windows LAPS in Entra device settings, deploy an Intune account protection LAPS policy to
    Windows devices and Windows LAPS Group Policy to domain-joined servers, set password length and
    rotation, limit who can read stored passwords, and remove other local administrator accounts that
    share a password.
  effort: S
  licence: [intune]
  sources: [ms-laps, ms-e8-restrict-admin]
  refs:
